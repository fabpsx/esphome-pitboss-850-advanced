#----------------------------------------------
text_sensor:
  # Affichage de l'adresse IP
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_ip
              text: !lambda 'return x;'
    ssid:
      name: "SSID WiFi"
    mac_address:
      name: "ADRESSE MAC"

#-------------------------------------------
# Contrôleur de température PID
#-------------------------------------------
climate:
  - platform: pid
    id: bbq_pid
    name: "Cntrl_Temp_BBQ °F"
    sensor: bbq_temp_pv
    heat_output: pid_out
    default_target_temperature: 180°F
    # 2. Configuration de la bande morte
    deadband_parameters:
      threshold_high: 2.0  # Température au-dessus de la cible
      threshold_low: -2.0  # Température en-dessous de la cible
    control_parameters:
      # Valeur PID initial à zéro le tuning est réglé dans les varaibles globales
      kp: 0.0
      ki: 0.0
      kd: 0.0
      # Valeur initial de limitation du pouvoir de correction de l'integral,
      # ces valeur vont changer dinamiquement selon température extérieur dans l'interval 60s
      min_integral: 0.10 #-0.20
      max_integral: 0.50 #0.25
    visual: { min_temperature: 150, max_temperature: 600, temperature_step: 5}

    # --- Mise à jour des élément visuel lvgl si changement dans Home Assistant ---
    on_control:
      then:
        - lambda: |-
            static float last_reported_target = -1.0; 
            
            if (x.get_target_temperature().has_value()) {
                float current_target = *x.get_target_temperature();
                
                // On ne met à jour l'affichage QUE si la valeur a changé de plus de 0.5 degré
                if (std::abs(current_target - last_reported_target) > 4.0f) {
                    last_reported_target = current_target;

                    // 1. Mise à jour de la cible (SP) de l'Arc
                    lv_arc_set_value(id(arc_sp), (int)current_target);

                    // 2. Mise à jour du texte du Preset
                    std::string val_str = esphome::str_sprintf("%.0f°F", current_target);
                    id(select_temp_preset).set_selected_text(val_str.c_str(), LV_ANIM_ON);

                    // 3. Affichage du label de confirmation
                    lv_obj_clear_flag(id(lbl_selection_live), LV_OBJ_FLAG_HIDDEN);
                    lv_label_set_text(id(lbl_selection_live), esphome::str_sprintf("Cible: %.0f°F", current_target).c_str());
                    
                    // On n'appelle le script que lors d'un changement réel
                    id(cacher_label_selection).execute();

                    // 4. Reset intégrale Smith lors d'un changement de SP
                    // Évite le dépassement causé par l'intégrale accumulée
                    // à l'ancien SP qui s'additionne au P du nouvel écart.
                    if (id(smith_active)) {
                        id(pid_integral)   = 0.0f;
                        id(smith_roc_last) = 0.0f;
                        ESP_LOGI("SMITH", "Reset intégrale — changement SP: %.1f°F",
                                 current_target);
                    }
                }
            }

image:
  # Logo Pitboss pour écran de veille
  - platform: file
    file: "pitboss_logo.png"
    id: img_logo_antiburn
    # Nouvelle syntaxe pour remplacer RGBA
    type: RGB
    transparency: alpha_channel

#-------------------------------------------
# Script d'automatisation
#-------------------------------------------
script:
  # Script d'affichage de l'heure sur chaque page
  - id: time_update
    then:
      - lvgl.label.update:
          id: lbl_current_time
          text:
            time_format: "%H:%M"
            time: !lambda return id(homeassistant_time).now();

  # Script de démarrage de la protection de l'écran cristaux liquide
  - id: start_antiburn_temporise
    mode: restart # Très important : relance le chrono de 5 min à chaque appel
    then:
      - delay: 5min
      - if:
          condition:
            switch.is_on: fan_relay
          then:
            # CAS 1 : Le ventilateur tourne -> On baisse seulement la luminosité
            - light.control:
                id: lcd_backlight
                brightness: 100%
            - logger.log: "Inactivité (Ventilateur ON) : Luminosité à 10 pourcent"
          else:
            # CAS 2 : Le ventilateur est arrêté -> OFF complet et Antiburn ON
            - switch.turn_on: switch_antiburn
            - logger.log: "Inactivité (Ventilateur OFF) : Écran OFF et Antiburn ON"

  # Script d'arrêt de la protection de l'écran cristaux liquide
  - id: stop_antiburn
    mode: restart
    then:
      - script.stop: start_antiburn_temporise
      - switch.turn_off: switch_antiburn
      - logger.log: "Activité détectée : Écran 100 pourcent et Antiburn OFF"

  # Script de départ du BBQ
  - id: seq_depart
    mode: restart
    then:
      - globals.set: {id: is_igniting, value: 'true'}
      - switch.turn_on: fan_relay
      - switch.turn_on: igniter_relay

      # Applique les 20% d'allumage
      - script.execute: update_auger_routing

      - wait_until:
          condition:
            sensor.in_range: {id: bbq_temp_pv, above: 135.0}
          timeout: 15min

      - if:
          condition:
            sensor.in_range: {id: bbq_temp_pv, above: 135.0}
          then:
            - logger.log: "Feu détecté. Stabilisation 2min..."
            - switch.turn_off: igniter_relay
            - delay: 2min

            # 1a. Reset intégrale PID natif (utile en mode PID pur)
            - climate.pid.reset_integral_term: {id: bbq_pid}

            # 1b. Reset Smith AVANT climate.control ET AVANT is_igniting=false
            #     Garantit que le 1er cycle Smith repart avec état propre.
            #     pid_last_temp=0.0 force roc=0 au premier cycle.
            - lambda: |-
                if (id(smith_active)) {
                    id(pid_integral)   = 0.0f;
                    id(pid_last_error) = 0.0f;
                    id(pid_last_temp)  = 0.0f;
                    id(pid_last_time)  = 0;
                    //id(smith_output_lisse).publish_state(0.10f);
                    //id(smith_output_level) = 0.10f;
                    id(smith_output_lisse).publish_state(id(pid_sortie_min));
                    id(smith_output_level) = id(pid_sortie_min);
                    ESP_LOGI("SMITH", "Reset Smith — EMA initialisé à 10%%.");
                }

            # 2. Démarre le PID (interface HA uniquement si Smith actif)
            - climate.control: {id: bbq_pid, mode: "HEAT"}
              # règle la cible à 180
            - climate.control: {id: bbq_pid, target_temperature: 180}

            # 3. Libère is_igniting APRÈS le reset — état propre garanti
            - globals.set: {id: is_igniting, value: 'false'}

            # 4. Mise à jour immédiate de la vis
            - script.execute: update_auger_routing

            - logger.log: "Régulation PID active."

          else:
            - binary_sensor.template.publish: {id: err_allumage, state: ON}
            - script.execute: seq_emergency_stop

  # Script d'arrêt du BBQ
  - id: seq_arret
    mode: restart
    then:
      # 0. Pré-refroidissement contrôlé si température élevée (> 300°F) :
      #    on ne coupe pas tout de suite, on ramène d'abord le feu à une
      #    cible de 200°F sous régulation PID, puis on attend d'être sous
      #    225°F (pas besoin d'atteindre la cible) avant d'entamer la
      #    séquence d'arrêt normale.
      #    Évite un choc thermique / flambée en coupant l'auger et
      #    l'allumeur d'un coup alors que le pot est encore très chaud.
      - globals.set: {id: pre_cooldown_active, value: 'false'}    # Reset (évite un état figé si le script redémarre)
      - if:
          condition:
            lambda: 'return id(bbq_temp_pv).state > 300.0;'
          then:
            - globals.set: {id: pre_cooldown_active, value: 'true'}
            - logger.log: "Séquence d'arrêt : température élevée, refroidissement contrôlé vers sortie PWM à 3%%"
            - climate.control: {id: bbq_pid, mode: "OFF"}
            - output.set_level: {id: auger_slow_pwm, level: 0.03}
            #- climate.control: {id: bbq_pid, mode: "HEAT"}
            #- climate.control: {id: bbq_pid, target_temperature: 200}
            - wait_until: { sensor.in_range: {id: bbq_temp_pv, below: 225.0} }
            - globals.set: {id: pre_cooldown_active, value: 'false'}
            - logger.log: "Température sous 225°F, poursuite de la séquence d'arrêt normale"

      - globals.set: {id: is_cooling, value: 'true'}                      # Vrai dans séquence d'arrêt du BBQ
      - globals.set: {id: is_igniting, value: 'false'}                    # Faux dans allumage en cours... (allumage terminé)
      - switch.turn_off: igniter_relay                                    # Arrêt de l'allumeur
      #- climate.control: {id: bbq_pid, mode: "OFF"}                       # Cntrl de température du BBQ en mode OFF
      - output.set_level: {id: auger_slow_pwm, level: 0.0}                # Temps de la vis au mimimum (0%)
      - globals.set: {id: smoke_mode_active, value: 'false'}              # Arrête le mode fumée
      - switch.turn_on: fan_relay                                         # Départ du ventilateur
      - delay: 5min                                                       # Attente de 5 minutes
      - wait_until: { sensor.in_range: {id: bbq_temp_pv, below: 125.0} }  # Attente température < 120 °F
      - switch.turn_off: fan_relay                                        # Arrêt du ventilateur
      - globals.set: {id: is_cooling, value: 'false'}                     # Faux dans séquence d'arrêt du BBQ (BBQ arrêté)

  # ------------------------------------------------------------------
  # Script de PURGE VIS
  # Usage : (1) URGENCE — vider les fines particules qui bloquent le
  #         flux d'air dans la vis pendant la séquence d'arrêt
  #         (is_cooling), risque de remontée de braise/fumée dans la
  #         trémie. Dans ce cas, l'allumeur est activé EN MÊME TEMPS
  #         que la vis, pour brûler les granules au fur et à mesure
  #         qu'elles arrivent plutôt que de les laisser s'empiler.
  #         (2) REMPLISSAGE — faire avancer des granules neuves après
  #         un remplissage de trémie vide, BBQ à l'arrêt complet
  #         (is_cooling = false). Dans ce cas, l'allumeur reste ÉTEINT :
  #         on veut juste amorcer la vis, pas démarrer un feu.
  # Autorisé quand le BBQ est à l'arrêt complet OU en séquence d'arrêt
  # (is_cooling). Refusé pendant l'allumage normal, la régulation
  # (HEAT), ou un arrêt d'urgence en cours.
  # Sécurités : plafond dur de 10 min peu importe le réglage HA, et
  # coupure immédiate + arrêt d'urgence si surchauffe détectée.
  # Fin de purge : en mode URGENCE, enchaîne sur seq_arret (refroidissement
  # complet). En mode REMPLISSAGE, aucun refroidissement requis (BBQ déjà
  # froid, allumeur jamais activé) : coupe simplement le ventilateur.
  # ------------------------------------------------------------------
  - id: seq_purge_vis
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return (!id(safety_shutdown) && !id(is_igniting) &&
                      id(bbq_pid).mode != climate::CLIMATE_MODE_HEAT &&
                      !id(purge_active));
          then:
            - globals.set: {id: purge_active, value: 'true'}

            # Plafond dur : 10 min max, peu importe le réglage HA
            - lambda: |-
                int minutes = (int)id(purge_duration_min).state;
                if (minutes < 1) minutes = 1;
                if (minutes > 10) minutes = 10;
                id(purge_remaining_s) = minutes * 60;

            # Allumeur ET ventilateur activés SEULEMENT en purge d'urgence
            # (is_cooling). En remplissage à l'arrêt complet, on n'allume
            # rien et le ventilateur reste éteint (pas de combustion, donc
            # pas besoin d'air).
            - if:
                condition:
                  lambda: 'return id(is_cooling);'
                then:
                  - switch.turn_on: fan_relay
                  - switch.turn_on: igniter_relay
                  - globals.set: {id: purge_igniter_used, value: 'true'}
                  - logger.log: "Purge vis démarrée — mode URGENCE (cooling) : vis 100(pourcent) + allumeur + ventilateur"
                else:
                  - globals.set: {id: purge_igniter_used, value: 'false'}
                  - logger.log: "Purge vis démarrée — mode REMPLISSAGE (arrêt) : vis 100(pourcent) seulement, sans ventilateur"

            - script.execute: update_auger_routing
            - lvgl.obj.update: {id: btn_purge, bg_color: 0xff7f00}

            # Boucle de compte à rebours (1s) avec vérif surchauffe à chaque tour
            - while:
                condition:
                  lambda: 'return id(purge_active) && (id(purge_remaining_s) > 0);'
                then:
                  - lvgl.label.update:
                      id: lbl_purge_text
                      text: !lambda |-
                        int m = id(purge_remaining_s) / 60;
                        int s = id(purge_remaining_s) % 60;
                        return str_sprintf("PURGE\n%d:%02d", m, s);
                  - delay: 1s
                  - globals.set:
                      id: purge_remaining_s
                      value: !lambda 'return id(purge_remaining_s) - 1;'
                  - if:
                      condition:
                        lambda: 'return id(bbq_temp_pv).state > 600.0;'
                      then:
                        - logger.log: "Purge vis : surchauffe détectée, arrêt d'urgence"
                        - globals.set: {id: purge_active, value: 'false'}
                        - script.execute: seq_emergency_stop

            # --- Fin de la purge (normale, arrêt manuel, ou surchauffe) ---
            # switch.turn_off est sans effet si l'allumeur n'avait pas été
            # activé (mode remplissage) — appel sans condition, sans risque.
            - globals.set: {id: purge_active, value: 'false'}
            - switch.turn_off: igniter_relay
            - script.execute: update_auger_routing
            - lvgl.obj.update: {id: btn_purge, bg_color: 0x1877F2}
            - lvgl.label.update: {id: lbl_purge_text, text: "PURGE\nVIS"}
            - logger.log: "Purge vis terminée"

            # Refroidissement sécuritaire (seq_arret) SEULEMENT si l'allumeur
            # a été utilisé (mode urgence/cooling) et pas déjà pris en charge
            # par seq_emergency_stop. En mode remplissage (BBQ déjà froid,
            # allumeur jamais activé), aucun risque : on coupe simplement le
            # ventilateur et on revient à l'arrêt directement.
            - if:
                condition:
                  lambda: 'return id(purge_igniter_used) && !id(safety_shutdown);'
                then:
                  - logger.log: "Purge vis : mode urgence -> refroidissement sécuritaire (seq_arret)"
                  - script.execute: seq_arret
                else:
                  - if:
                      condition:
                        lambda: 'return !id(purge_igniter_used);'
                      then:
                        - switch.turn_off: fan_relay
                        - logger.log: "Purge vis : mode remplissage -> arrêt direct, aucun risque"
          else:
            - logger.log: "Purge vis refusée : BBQ en marche, en allumage, ou en erreur"

  # Script d'amorçage de granule 30 secondes
  - id: seq_amorcage_chrono
    mode: single
    then:
      - globals.set: {id: is_priming, value: 'true'}
      - logger.log: "Amorçage 10s lancé"
      - lvgl.obj.update:
          id: btn_prime
          bg_color: 0xFF9800
      # Plus de output.set_level ici — le routeur voit is_priming=true et met 1.0
      - delay: 10s
      # Plus de output.set_level ici non plus
      - globals.set: {id: is_priming, value: 'false'}
      - logger.log: "Amorçage terminé"

  # Script d'arrêt d'urgence
  - id: seq_emergency_stop
    mode: restart
    then:
      - logger.log: "!!! SÉCURITÉ THERMIQUE ACTIVÉE !!!"                  # Message dans le log (Sécurité thermique activée)
      - globals.set: {id: safety_shutdown, value: 'true'}                 # Vrai dans Arrêt d'urgence en cours...
      - climate.control: {id: bbq_pid, mode: "OFF"}                       # Arrêt du contrôleur bbq_pid
      - switch.turn_off: igniter_relay                                    # Arrêt de l'allumeur
      - output.set_level: {id: auger_slow_pwm, level: 0.0}                # Arrêt de la vis
      - switch.turn_on: fan_relay                                         # Ventilateur en marche
      #- lvgl.obj.update:                                                  # Background de la page principale en rouge
          #id: main_page
          #bg_color: 0xC62828
      
      - delay: 15min                                                      # Temps pour brûler les résidus et refroidir le pot
      - switch.turn_off: fan_relay                                        # Arrêt du ventilateur
      - logger.log: "Arrêt d'urgence terminé. Inspection requise."        # Message dans le log (Inspection requise)

  # Script de réinitialisation manuel des erreurs
  - id: reset_systeme_erreurs
    then:
      - logger.log: "Reset manuel des erreurs"
      # 1. Éteindre les bits d'erreur
      - binary_sensor.template.publish: { id: err_allumage, state: OFF }
      - binary_sensor.template.publish: { id: err_surchauffe, state: OFF }
      # 2. Remettre le fond d'écran normal (Gris très pâle)
      - lvgl.obj.update:
          id: main_page
          bg_color: ${color_bg}
      # 3. Remettre les textes de diagnostic en état normal
      - lvgl.label.update: { id: lbl_diag_allumage, text: "ALLUMAGE: OK", text_color: 0xFFFFFF }
      - lvgl.label.update: { id: lbl_diag_surchauffe, text: "TEMPÉRATURE: OK", text_color: 0xFFFFFF }

  # Script de vérification d'appuie long (3 secondes) sur bouton Départ
  - id: check_long_press
    mode: restart
    then:
      - delay: 3s
      # Si on arrive ici, c'est que le bouton est resté appuyé 3s sans être relâché
      - lvgl.widget.show: start_confirm_box
      - logger.log: "Appui long validé !"

  # Script de vérification d'appuie long (3 secondes) sur bouton autotune
  - id: check_long_press_autotune
    mode: restart
    then:
      - delay: 3s
      - lvgl.widget.show: autotune_confirm_box
      - logger.log: "Appui long autotune validé !"

  # Script de visualisation de la valeur sélectionné à partir de l'arc
  - id: cacher_label_selection
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            lambda: |-
              // Utilisation de la fonction LVGL pour lire la valeur
              int val = lv_arc_get_value(id(arc_sp));
              
              // Liste de tes presets
              std::vector<int> presets = {150, 180, 200, 225, 250, 275, 300, 325, 350, 375, 400, 425, 450, 475, 500};
              
              // On vérifie si on est pile sur un preset
              for(int p : presets) {
                if (val == p) return true;
              }
              return false;
          then:
            - lambda: |-
                lv_obj_add_flag(id(lbl_selection_live), LV_OBJ_FLAG_HIDDEN);
          else:
            # Si on n'est pas sur un preset, on attend encore 1s avant de réessayer
            - delay: 3s
            - script.execute: cacher_label_selection

  # Script d'aiguillage de la valeur envoyé à la sortie physique de la vis d'alimentation de granules
  - id: update_auger_routing
    then:
      - lambda: |-
          float val = 0.0f;

          // ================================================================
          // BRANCHE A : PRÉDICTEUR DE SMITH
          // La valeur brute P+I+D est calculée dans update_smith_output,
          // puis lissée via smith_out → smith_output_lisse → smith_output_level.
          // Ici on lit simplement smith_output_level (déjà lissé).
          // ================================================================
          if (id(smith_active) &&
              id(bbq_pid).mode == CLIMATE_MODE_HEAT &&
              !id(is_igniting) && !id(is_cooling)) {

              val = id(smith_output_level);

          // ================================================================
          // RESET PRÉVENTIF — Smith actif mais pas en mode calcul
          // Garde l'état interne propre pendant allumage, refroidissement
          // ou mode OFF pour éviter windup et pic D au redémarrage.
          // ================================================================
          } else if (id(smith_active) &&
                     (id(is_igniting) || id(is_cooling) ||
                      id(bbq_pid).mode == CLIMATE_MODE_OFF)) {
              id(pid_integral)   = 0.0f;
              id(pid_last_error) = 0.0f;
              id(pid_last_temp)  = id(bbq_temp_pv).state;
              id(pid_last_time)  = 0;

          // ================================================================
          // BRANCHE B : PID NATIF ESPHOME
          // Même pipeline que Smith mais côté natif :
          // pid_out → pid_output_lisse → pid_output_level
          // ================================================================
          } else if (!id(smith_active) &&
                     id(bbq_pid).mode == CLIMATE_MODE_HEAT &&
                     !id(is_igniting) && !id(is_cooling)) {
              val = id(pid_output_level);
          }

          // ================================================================
          // LOGIQUE DE ROUTAGE PAR PRIORITÉ
          // Ces états ont priorité absolue sur les calculs PID/Smith.
          // ================================================================
          if (id(is_priming) || id(manual_prime_active) || id(purge_active)) {
              val = 1.0f;
          } else if (id(is_igniting)) {
              val = 0.20f;
          } else if (id(smoke_mode_active)) {
              val = id(smoke_intensity);
          }

          // ================================================================
          // SÉCURITÉS ET LIMITES PHYSIQUES
          // ================================================================
          bool calcul_actif = (id(bbq_pid).mode != CLIMATE_MODE_OFF || id(autotune_active));
          if (calcul_actif && !id(is_cooling)) {
              if (!id(is_priming) && !id(manual_prime_active) && !id(purge_active)) {
                  //float min_allowed = id(smoke_mode_active) ? 0.05f : 0.10f;
                  //if (val < min_allowed) val = min_allowed;
                  //if (val > 0.50f) val = 0.50f;
                  float min_allowed = id(smoke_mode_active) ? 0.05f : id(pid_sortie_min);
                  if (val < min_allowed) val = min_allowed;
                  if (val > id(pid_sortie_max)) val = id(pid_sortie_max);
              }
          }

          // ================================================================
          // ACTION PHYSIQUE
          // ================================================================
          id(actual_routing_output) = val;
          id(auger_slow_pwm).set_level(val);

          // ================================================================
          // AFFICHAGE LVGL
          // ================================================================
          if (id(purge_active)) {
              lv_label_set_text(id(lbl_duty), "Charge PURGE VIS: 100%");
          } else if (id(is_priming) || id(manual_prime_active)) {
              lv_label_set_text(id(lbl_duty), "Charge AMORÇAGE: 100%");
          } else if (id(is_igniting)) {
              lv_label_set_text(id(lbl_duty), "Charge ALLUMAGE: 20%");
          } else if (id(autotune_active)) {
              lv_label_set_text(id(lbl_duty), str_sprintf("AUTO-TUNE: %.0f%%", (val * 100.0f)).c_str());
          } else if (id(smoke_mode_active)) {
              lv_label_set_text(id(lbl_duty), str_sprintf("Charge FUMÉE: %.0f%%", (val * 100.0f)).c_str());
          } else if (id(bbq_pid).mode == CLIMATE_MODE_OFF || id(pre_cooldown_active)) {
              lv_label_set_text(id(lbl_duty), "Charge: Prérefroidissement (3%)");
          } else if (id(bbq_pid).mode == CLIMATE_MODE_OFF || !id(pre_cooldown_active)) {
              lv_label_set_text(id(lbl_duty), "Charge: ARRÊT (0%)");
          } else if (id(smith_active)) {
              lv_label_set_text(id(lbl_duty), str_sprintf("Smith PID: %.0f%%", (val * 100.0f)).c_str());
          } else {
              lv_label_set_text(id(lbl_duty), str_sprintf("Charge PID: %.0f%%", (val * 100.0f)).c_str());
          }

  # ================================================================
  # SCRIPT update_smith_output
  # Calcule P+I+D et écrit dans smith_out (output template).
  # Le pipeline smith_out → smith_output_lisse → smith_output_level
  # applique le filtre EMA puis déclenche update_auger_routing
  # via on_value de smith_output_lisse.
  # Appelé par : on_value de bbq_temp_pv (même déclencheur que
  # pid_out pour le PID natif).
  # ================================================================
  - id: update_smith_output
    then:
      - lambda: |-

          // Ne calculer que si Smith est actif et en mode régulation
          if (!id(smith_active) ||
              id(bbq_pid).mode != CLIMATE_MODE_HEAT ||
              id(is_igniting) || id(is_cooling)) {
              return;
          }

          // --- Calcul du pas de temps (dt) ---
          uint32_t now = millis();
          float dt;
          if (id(pid_last_time) == 0) {
              dt = 1.0f;
          } else {
              dt = (float)(now - id(pid_last_time)) / 1000.0f;
          }
          if (dt > 5.0f) dt = 5.0f;

          // Met à jour pid_last_time AVANT la garde
          id(pid_last_time) = now;

          // --- Protection double-appel ---
          if (dt < 0.5f) {
              ESP_LOGV("SMITH", "Cycle ignoré — dt trop court: %.3fs", dt);
              return;
          }

          // --- Lecture des entrées ---
          float current_temp = id(bbq_temp_pv).state;
          float set_point    = id(bbq_pid).target_temperature;
          float tau          = id(smith_tau);
          float theta        = id(smith_theta);

          // --- Vérification NaN ---
          if (std::isnan(current_temp)) {
              ESP_LOGW("SMITH", "Sonde PV NaN — calcul annulé");
              return;
          }

          // Sécurité : PID natif bien neutralisé
          auto *pid_c = (pid::PIDClimate *)id(bbq_pid);
          pid_c->set_kp(0.0f);
          pid_c->set_ki(0.0f);
          pid_c->set_kd(0.0f);

          // --- Taux de variation de la température (°F/s) ---
          // On conserve le dernier roc valide tant que la temp n'a pas changé
          // (sonde ADS1115 publie toutes les 5s)
          float roc = id(smith_roc_last);
          if (id(pid_last_temp) > 0.0f &&
              std::abs(current_temp - id(pid_last_temp)) > 0.05f) {
              roc = (current_temp - id(pid_last_temp)) / dt;
              if (roc >  2.0f) roc =  2.0f;
              if (roc < -2.0f) roc = -2.0f;
              id(smith_roc_last) = roc;
          }

          // --- Température prédite dans 'theta' secondes ---
          // Facteur Smith = (1 - e^(-theta/tau))
          float smith_factor   = 1.0f - expf(-theta / tau);
          float predicted_temp = current_temp + (roc * theta * smith_factor);

          // --- Erreurs ---
          float error = set_point - current_temp;

          // Zone morte sur roc : en régime établi ET erreur faible,
          // on utilise l'erreur réelle pour éviter les oscillations.
          // Si erreur réelle > 10°F, on force la prédiction active.
          float predicted_error;
          if (std::abs(roc) > 0.15f || std::abs(error) > 10.0f) {
              predicted_error = set_point - predicted_temp;
              ESP_LOGD("SMITH", "Prédiction active — roc:%.3f Pred:%.1f", roc, predicted_temp);
          } else {
              predicted_error = error;
              ESP_LOGD("SMITH", "Zone morte roc:%.3f — erreur réelle utilisée", roc);
          }

          // ================================================================
          // NORMALISATION PAR LA PLAGE DU PROCÉDÉ — Style industriel PROVOX
          // Kp = gain pur  (ex: 0.90 → P=9% pour erreur=10% de la plage)
          // Ki = répétitions/minute (ex: 0.27 rép/min)
          // plage_procede = SP_max - SP_min = 600 - 150 = 450°F
          // Comportement mathématiquement identique à l'ancien code —
          // seules les unités de Kp et Ki changent.
          // Ancien code : P = 0.002 x error
          // Nouveau code : P = 0.90 x (error / 450) = 0.002 x error ✅
          // ================================================================
          float plage = id(plage_procede);

          // Erreur normalisée sur la plage du procédé (0.0 à 1.0)
          float predicted_error_norm = predicted_error / plage;

          // --- Terme P normalisé ---
          // Kp=0.90 + erreur=45°F sur 450°F → P = 0.90 x (45/450) = 9%
          float p_term = id(base_kp) * predicted_error_norm;

          // --- Terme I en répétitions/minute (parallèle) avec Anti-windup ---
          float potential_integral = id(pid_integral) + (predicted_error_norm * (dt / 60.0f));
          float i_raw = id(base_ki) * potential_integral;

          // Détection de saturation basée sur la sortie totale estimée (P + I)
          float sortie_estimee = p_term + i_raw;
          bool sature_bas = (sortie_estimee <= id(pid_sortie_min));
          bool sature_haut = (sortie_estimee >= id(pid_sortie_max));  
          
          // dt converti en minutes → Ki s'exprime en rép/min
          // Ki=0.27 rép/min : après 1 min d'erreur de plage complète → I = 0.27 x 1.0 = 27%
          // Ancien code : pid_integral += predicted_error x dt (secondes)
          //               i_raw = 0.00001 x pid_integral
          // Nouveau code : pid_integral += (predicted_error/450) x (dt/60)
          //                i_raw = 0.27 x pid_integral
          // Résultat identique : 0.00001 x error x dt = 0.27 x (error/450) x (dt/60) ✅

          // On n'autorise l'intégration que si on ne sature pas OU si on s'en éloigne
          // Note: on utilise predicted_error_norm pour être cohérent avec le Smith
          
          // Flag démarrage (Indispensable pour décoller du plancher)
          bool demarrage = (id(smith_output_level) <= id(pid_sortie_min) && error > 5.0f);
          
          // On intègre si : démarrage OU (non saturé dans la direction de l'erreur RÉELLE)
          bool integrer = demarrage || ((!sature_bas || error > 0.0f) && (!sature_haut || error < 0.0f));

          if (integrer) {
              id(pid_integral) = potential_integral;
          }     

          // ===============================================
          // BORNE ABSOLUE DE L'INTÉGRALE (Back-Calculation)
          // ===============================================
          i_raw = id(base_ki) * id(pid_integral);

          // Borne Haute
          if (i_raw > id(pid_sortie_max)) {
              id(pid_integral) = id(pid_sortie_max) / id(base_ki);
          }

          // Borne Basse : Empêche l'intégrale de "creuser" sous le minimum
          // On ajuste l'intégrale pour que (P + I) ne soit jamais < pid_sortie_min
          float i_min_requis = id(pid_sortie_min) - p_term;
          if (i_raw < i_min_requis) {
              id(pid_integral) = i_min_requis / id(base_ki);
          }
          
          float i_term = i_raw;

          // --- Terme D --- DÉSACTIVÉ
          float d_term = 0.0f;

          // --- Sortie brute ---
          float smith_raw = p_term + i_term + d_term;

          // --- Borne sur smith_raw ---
          // Protection finale avant envoi vers le pipeline EMA.
          // Le bornage est répété dans smith_out write_action avant l'EMA
          // pour garantir que le filtre ne lisse jamais hors des limites.
          //if (smith_raw < 0.10f) smith_raw = 0.10f;
          //if (smith_raw > 0.50f) smith_raw = 0.50f;
          if (smith_raw < id(pid_sortie_min)) smith_raw = id(pid_sortie_min);
          if (smith_raw > id(pid_sortie_max)) smith_raw = id(pid_sortie_max);

          // --- Mémorisation pour le prochain cycle ---
          if (std::abs(current_temp - id(pid_last_temp)) > 0.05f) {
              id(pid_last_temp) = current_temp;
          }
          id(pid_last_error) = predicted_error;

          ESP_LOGD("SMITH",
              "PV:%.1f SP:%.1f Pred:%.1f roc:%.3f | ErrR:%.1f ErrP:%.1f ErrN:%.4f | "
              "P:%.3f I:%.3f dt:%.2fs | Raw:%.3f int:%.4f",
              current_temp, set_point, predicted_temp, roc,
              error, predicted_error, predicted_error_norm,
              p_term, i_term, dt, smith_raw,
              id(pid_integral));

          // --- Envoi vers le pipeline de lissage ---
          // Le bornage pid_sortie_min/max est aussi appliqué dans
          // smith_out write_action avant le filtre EMA
          id(smith_out).set_level(smith_raw);


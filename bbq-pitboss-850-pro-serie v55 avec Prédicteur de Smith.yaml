esphome:
  name: ${node_name}
  friendly_name: "BBQ_PitBoss_Pro_850"
  comment: "Cntrl de temp. optimisé BBQ Pitboss 850 Pro Series"
  
  build_flags:
    - "-DBOARD_HAS_PSRAM"

  on_boot:
    - priority: 800  # On commence très tôt pour fixer le matériel
      then:
        # 1. Stabilisation immédiate du rétroéclairage (Registre 0x02)
        - lambda: |-
            // On force le registre de mode de la puce CH32 (Registre 0x02)
            // pour s'assurer qu'elle est bien en mode PWM et non en flottement
            uint8_t init_mode[] = {0x02, 0x02}; 
            id(bus_a).write(0x24, init_mode, 2);
          
            // On force une valeur de sécurité (éteint en inversé)
            uint8_t init_off[] = {0x05, 255};
            id(bus_a).write(0x24, init_off, 2);

        - delay: 1s # <--- Ajoute une pause pour laisser le GT911 se réveiller proprement

        # 2. Allumage contrôlé
        - light.turn_on:
            id: lcd_backlight
            brightness: 100%

        # 3. Paramétrage des composants logiciels    
        - switch.turn_off: switch_antiburn
          # Initialisation du thermostat
        - climate.control:
            id: bbq_pid
            mode: "OFF"
            target_temperature: 180

        # 4. Remise à zéro des variables
        - globals.set: {id: is_igniting, value: 'false'}
        - globals.set: {id: is_cooling, value: 'false'}
        - globals.set: {id: smoke_mode_active, value: 'false'}
          # Aucune fautes au boot
        - binary_sensor.template.publish: { id: err_allumage, state: OFF }
        - binary_sensor.template.publish: { id: err_surchauffe, state: OFF }
        - binary_sensor.template.publish: { id: err_sonde_cuve, state: OFF }

        # 5. Ajustement des paramètres du Climate PID selon valeurs défini dans la variables globales
          # Délai de 5s avant ajustement des variables globales du PID
        - delay: 5s 
          # Synchronise les paramètres pid au paramètre pid définis dans les globals
        - lambda: |-
            // Synchronise les curseurs HA avec les valeurs de tes globales au démarrage
            id(tuner_kp).publish_state(id(base_kp));
            id(tuner_ki).publish_state(id(base_ki));
            id(tuner_kd).publish_state(id(base_kd));
          # Délai de 500ms avant déverrouillage du PID
        - delay: 500ms
        - lambda: |-
            // 3. On ouvre le verrou : maintenant les changements manuels dans HA seront acceptés
            id(pid_sync_ready) = true;
            ESP_LOGI("boot", "Verrou PID levé, synchro terminée.");

        # --- Activation du Prédicteur de Smith au démarrage ---
        # S'exécute après pid_sync_ready pour que les gains soient prêts.
        # Si smith_active est restauré à true (restore_value: yes), on force
        # la neutralisation du PID natif immédiatement.
        - lambda: |-
            if (id(smith_active)) {
                // Neutralisation du PID natif si Prédicteur de Smith actif
                auto *pid_c = (pid::PIDClimate *)id(bbq_pid);
                pid_c->set_kp(0.0f);
                pid_c->set_ki(0.0f);
                pid_c->set_kd(0.0f);
                id(pid_integral)   = 0.0f;
                id(pid_last_error) = 0.0f;
                id(pid_last_temp)  = 0.0f;
                id(pid_last_time)  = 0;
                ESP_LOGI("SMITH", "Boot : Prédicteur de Smith actif — PID natif neutralisé");
            } else {
                ESP_LOGI("SMITH", "Boot : Mode PID natif actif");
            }

    # ------------------------------------------------------------------
    # Détection "API absente au démarrage" (cas typique d'une panne de
    # courant générale où le panneau termine son boot avant HA).
    # Si l'API n'est toujours pas connectée 20s après le boot, on lève
    # un drapeau. Dès que l'API se connecte enfin (voir api.on_client_connected
    # plus bas), on force UN redémarrage logiciel du panneau, dans
    # l'espoir de reproduire les conditions d'une réparation manuelle
    # (reboot alors que HA est déjà disponible).
    # ------------------------------------------------------------------
    - priority: -100  # Tardif, après que tous les composants soient configurés
      then:
        - delay: 20s
        - if:
            condition:
              not:
                api.connected:
            then:
              - logger.log: "API absente 20s après le boot, drapeau levé pour reboot différé"
              - globals.set:
                  id: api_was_absent_at_boot
                  value: "true"

# --- INFRASTRUCTURE WAVESHARE ET CAPTEUR VL6180x---
external_components:
  - source: github://pr#10071
    components: [waveshare_io_ch32v003]

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_HZ: "1000"
      CONFIG_SPIRAM_MODE_OCT: y
      CONFIG_IDF_EXPERIMENTAL_FEATURES: y
      CONFIG_SPIRAM_SPEED_120M: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_COMPILER_OPTIMIZATION_PERF: y

psram:
  mode: octal
  speed: 80MHz

# Active le log
logger:
# Par défaut le log est en level: DEBUG donc complet, activer une des ligne suivante pour obtenir moins de log
  #level: INFO
  #level: WARN
  #level: ERROR

# Enable Home Assistant API
api:
  reboot_timeout: 0s  # Désactive le reboot automatique en cas de perte de connexion
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    then:
      - if:
          condition:
            lambda: "return id(api_was_absent_at_boot);"
          then:
            - logger.log: "Première connexion API après absence au boot -> reboot du panneau dans 5s"
            # On remet le drapeau à faux immédiatement pour éviter toute
            # boucle de reboot si l'API se déconnecte/reconnecte ensuite
            # avant le redémarrage effectif.
            - globals.set:
                id: api_was_absent_at_boot
                value: "false"
            - delay: 5s
            - button.press: panel_reboot_on_late_api

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  use_address: 192.168.0.10
  manual_ip:
    static_ip: 192.168.0.10
    gateway: 192.168.0.1
    subnet: 255.255.255.0
  min_auth_mode: WPA2 

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Bbq-Pitboss-850-Pro-Serie"
    password: !secret fallback_password

captive_portal:

# Serveur Web
web_server:
  port: 80
#  ota: False # Si activé, ne permet pas de mise à jour via le serveur Web
#  include_internal: True # Si activé, affiche les valeurs des senseurs internes

waveshare_io_ch32v003:
  - id: waveshare_io_hub
    address: 0x24

#-------------------------------------------
# Paramètre du Bus I2C
#-------------------------------------------
i2c:
  - id: bus_a
    sda: 8
    scl: 9
    scan: false
    frequency: 50kHz # Fréquence recommandée pour l'AHT20 et l'écran tactile
    timeout: 50ms # <--- Ajoutez ceci pour donner de la marge aux modules lents
#------------------------------------------------------------------------------
# Bus UART2 — Capteur ultrason Étanche DFRobot A02YYUW pour niveau de la Trémie
#------------------------------------------------------------------------------
uart:
  - id: uart_tremie
    tx_pin: 43   # TX de la carte → RX du DFRobot A02YYUW
    rx_pin: 44   # RX de la carte ← TX du DFRobot A02YYUW
    baud_rate: 9600

#-------------------------------------------
# Carte extension IO Discret MCP23017
#-------------------------------------------
mcp23017:
  - id: mcp_hub
    address: 0x20  # Adresse par défaut (A0, A1, A2 au GND)

#-------------------------------------------
# Carte extension Entrées analogique ADS1115
#-------------------------------------------
ads1115:
  - address: 0x48
    id: ads_hub

#-------------------------------------------
# Sortie analogue
#-------------------------------------------
output:
# Rétro-éclairage
  - platform: waveshare_io_ch32v003
    id: backlight_pwm_output
    waveshare_io_ch32v003_id: waveshare_io_hub
    inverted: true
    min_power: 0.07
    max_power: 1.00

# Sortie du PID PWM lente cycle de 30 sec.
  - platform: slow_pwm
    id: auger_slow_pwm
    pin: 6 # La pin GP6 de ton connecteur
    period: 20s # Cycle de 15 secondes
    # Ajoute ces deux lignes ici :
    min_power: 0.0    # Équivalent à 0%
    max_power: 1.0    # Équivalent à 100%

# --- 2 sorties virtuel pour le PID et le Prédicteur de Smith   ---
# --- Permet de les traiter dans le script de routing           ---
# --- avant de les envoyer à la sortie physique (auger_slow_pwm)---
# Sortie virtuelle pour le PID (ne touche pas la pin physique)
  - platform: template
    id: pid_out
    type: float
    write_action:
      - lambda: |-
          // On publie la valeur brute 'state' vers le lisseur
          id(pid_output_lisse).publish_state(state);

# Sortie virtuelle pour le Prédicteur de Smith (ne touche pas la pin physique)
  - platform: template
    id: smith_out
    type: float
    write_action:
      - lambda: |-
          // Borne AVANT le filtre EMA pour éviter que l'EMA
          // lisse vers des valeurs sous le plancher physique de 10%
          float val_bornee = state;
          //if (val_bornee < 0.10f) val_bornee = 0.10f;
          //if (val_bornee > 0.50f) val_bornee = 0.50f;
          if (val_bornee < id(pid_sortie_min)) val_bornee = id(pid_sortie_min);
          if (val_bornee > id(pid_sortie_max)) val_bornee = id(pid_sortie_max);
          id(smith_output_lisse).publish_state(val_bornee);

light:
  - platform: monochromatic
    id: lcd_backlight
    name: "Luminosité Écran"
    output: backlight_pwm_output
    restore_mode: ALWAYS_ON
    default_transition_length: 200ms
    on_turn_on:
      then:
        - switch.turn_on: backlight_enable
        - script.execute: stop_antiburn
    on_turn_off:
      then:
        - switch.turn_off: backlight_enable
        - script.execute: start_antiburn_temporise

#-------------------------------------------
# Entrée analogue
#-------------------------------------------
sensor:
  # Température interne du processeur
  - platform: internal_temperature
    name: "Température Interne ESP32-S3"

  # --- Sonde de température et humidité extérieur ---
  - platform: aht10
    variant: AHT20
    address: 0x38
    update_interval: 61.5s
    temperature:
      name: "Temp_Exterieur"
      id: temp_ext
      accuracy_decimals: 1
      on_value:
        then:
          - lvgl.label.update: # Ajuste indicateur de température extérieur
              id: temperature_ext
              text:
                format: "%.1f°C"
                args: [ 'x' ]
    humidity:
      name: "Humidite_Exterieur"
      id: hum_ext
      accuracy_decimals: 0
      on_value:
        then:
          - lvgl.label.update: # Ajuste indicateur d'humidité extérieur
              id: humidite_ext
              text:
                format: "%.0f%%"
                args: [ 'x' ]

  # Nouveau capteur Ultrasonique A02YYUW pour niveau de la Trémie
  - platform: a02yyuw
    uart_id: uart_tremie
    name: "Trémie Dist.RAW (mm)"
    id: granules_mm
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_granules_mm
            text:
              format: "Capteur Trémie: %.1f mm"
              args: [ 'x' ]
    filters:
      - filter_out: nan

      # 1. Median large — prend la valeur centrale et ignore les extrêmes
      # Élimine autant les pics vers le haut que vers le bas
      - median:
          window_size: 30
          send_every: 1

      # 2. EMA très doux pour suivre la tendance lente
      # À 0.02 : ~50 lectures pour atteindre 63% d'un vrai changement
      # Ce qui correspond à plusieurs minutes — parfait pour un niveau de trémie
      - exponential_moving_average:
          alpha: 0.01
          send_every: 1

  # Logique de calcul en % du niveau de la Trémie
  - platform: template
    name: "Trémie Niveau Granules"
    id: niveau_granules
    unit_of_measurement: "%"
    icon: "mdi:archive-arrow-down-outline"
    update_interval: 10s
    lambda: |-
      // --- 1. VERIFICATIONS INITIALES ---
      const float DIST_ZONE_MORTE = 35.0;  // Distance mesurée quand trémie pleine
      if (id(porte_tremie).state) return id(niveau_granules).state; // Si la porte est ouverte gèle la valeur
      float x_mm = id(granules_mm).state;
      if (std::isnan(x_mm) || x_mm < DIST_ZONE_MORTE) return 100.0; // Si capteur trop près des granules en 100%

      // --- 2. PARAMETRES DE LA TREMIE (en cm) ---
      // Modifier ces valeurs selon vos mesures réelles
      const float L_HAUT = 37.0;     // Longueur sommet
      const float l_HAUT = 26.0;     // Largeur sommet
      const float L_BAS  = 16.0;     // Longueur base
      const float l_BAS  = 10.0;     // Largeur base
      const float H_HAUTE = 8.0;     // Hauteur de la partie droite (cube) 2cm du couvercle
      const float H_BASSE = 10.0;    // Hauteur de la partie inclinée (tronc)
      
      // Calibration du capteur (en mm)
      // Distance totale capteur -> fond (3.5 zone morte + 4.5 mesurable + 10.0 cône)
      const float DIST_VIDE  = 180.0; // Distance mesurée quand trémie vide

      // --- 3. CALCULS DES VOLUMES DE RÉFÉRENCE (en cm3) ---
      // Aire du haut, du bas et de la partie droite
      float aire_haut = L_HAUT * l_HAUT;
      float aire_bas  = L_BAS * l_BAS;

      // Volume du tronc de pyramide (V = h/3 * (A1 + A2 + sqrt(A1*A2)))
      float vol_partie_basse = (H_BASSE / 3.0) * (aire_haut + aire_bas + sqrt(aire_haut * aire_bas));
      // Volume de la partie haute = (aire_haut * H_HAUTE)
      float vol_partie_haute = aire_haut * H_HAUTE;
      // Volume total
      float vol_total = vol_partie_haute + vol_partie_basse;

      // --- 4. LOGIQUE DE CALCUL DU NIVEAU ---
      // h_matiere_cm représente la hauteur de granules depuis le fond (0 à 18cm)
      float h_matiere_cm = (DIST_VIDE - x_mm) / 10.0;

      // Sécurité bornes
      if (h_matiere_cm >= (H_HAUTE + H_BASSE)) return 100.0;
      if (h_matiere_cm <= 0) return 0.0;

      float vol_actuel = 0.0;

      // CAS B : Les granules sont dans la partie inclinée (Bas)
      if (h_matiere_cm <= H_BASSE) {
        // --- On est dans la partie basse (Tronc de pyramide) ---
        float ratio = h_matiere_cm / H_BASSE;
        float L_actuel = L_BAS + (L_HAUT - L_BAS) * ratio;
        float l_actuel = l_BAS + (l_HAUT - l_BAS) * ratio;
        float aire_actuelle = L_actuel * l_actuel;
        vol_actuel = (h_matiere_cm / 3.0) * (aire_actuelle + aire_bas + sqrt(aire_actuelle * aire_bas));
      } 
      // CAS A : Les granules sont dans la partie droite (Haut)
      else {
        // --- On est dans la partie haute (Base pleine + surplus rectangulaire) ---
        float h_dans_partie_haute = h_matiere_cm - H_BASSE;
        vol_actuel = vol_partie_basse + (aire_haut * h_dans_partie_haute);
      }

      // --- 5. RÉSULTAT ---
      return (vol_actuel / vol_total) * 100.0;

    on_value:
      then:
        # 1. On met à jour le texte de la valeur de niveau
        - lvgl.label.update:
            id: lbl_text_pct_niveau_granules
            text: !lambda 'return str_sprintf("%.0f %%", x);'
        # 2. On met à jour la barre indicatrice
        - lvgl.bar.update:
            id: niveau_tremie_bar
            value: !lambda "return (int)x;"

    # --- Gestion de l'alerte visuelle (Orange si < 10%, Gris si > 15%) ---
#    on_value_range:
      # Seuil d'alerte : passe à l'Orange si le niveau descend sous 15%
#      - below: 10.0
#        then:
#          - lvgl.obj.update:
#              id: main_page
#              bg_color: 0xFF9800 # Orange
#          - logger.log: "Alerte : Niveau de granules faible !"

      # Seuil de rétablissement : revient au Gris si le niveau remonte au-dessus de 25%
#      - above: 15.0
#        then:
#          - lvgl.obj.update:
#              id: main_page
#              bg_color: ${color_bg} # Retour au Gris pâle
#          - logger.log: "Niveau de granules OK."


  # --- SONDE DE TEMPÉRATURE D'ORIGINE DU BBQ (Sur A0) ---
  - platform: ads1115
    multiplexer: 'A0_GND' # Typiquement A0 pour la cuve
    gain: 2.048           # Gain idéal 2.048 pour une PT1000 avec résistance 1k
    id: bbq_chamber_voltage
    name: "Voltage sonde BBQ"
    update_interval: 5s
    # Affichage sur page de diagnostique
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_volt_sonde_bbq
            text:
              format: "Volt Sonde BBQ: %.1f V"
              args: [ 'x' ]

# --- CAPTEUR DE RÉSISTANCE (La valeur brute en Ohms) ---
  - platform: resistance
    id: bbq_temp_res
    sensor: bbq_chamber_voltage
    configuration: DOWNSTREAM
    resistor: 2170Ohm      # Correction par rapport à 2200 Ohms
    name: "Résistance Sonde BBQ"
    unit_of_measurement: "Ω"
    accuracy_decimals: 1
    # Affichage sur page de diagnostique
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_res_sonde_bbq
            text:
              format: "Rés. Sonde BBQ: %.1f Ω"
              args: [ 'x' ]

  - platform: copy
    source_id: bbq_temp_res
    id: bbq_temp_pv
    name: "Temp Cuve BBQ °F"
    # l'unité de mesure est mise en °C pour forcer HA à ne pas convertir, cela fais que 180 °F dans ESPHome donne 180 °C dans HA
    unit_of_measurement: "°C" 
    device_class: "temperature" # Dis à HA que c'est une température
    state_class: "measurement"  # Dis à HA que c'est une mesure
    accuracy_decimals: 1 # Pas besoin de décimales pour la cuve, c'est plus lisible
    filters:

# Cette calibration est la calibration standard pour une sonde de type PT1000
#      - calibrate_linear:
#          # Valeurs standards PT1000 (très précises pour la cuve)
#          - 1000.0 -> 32.0   # 0°C
#          - 1144.1 -> 100.0  # 37.8°C (Début Zone de fumage)
#          - 1285.8 -> 170.0  # 76.7°C (Fin Zone de fumage)
#          - 1385.1 -> 212.0  # 100°C (Point d'ébullition pour test)
#          - 1572.0 -> 300.0  # 148.9°C (Zone de cuisson)
#          - 1758.6 -> 400.0  # 204.4°C (Rôtissage)
#          - 1957.5 -> 500.0  # 260.0°C (Saisissage)
#          - 2165.2 -> 600.0  # 315.5°C (Nettoyage/Max BBQ)

      # Courbe de calibration corrigé en fonction de la température réel au niveau de la grille
      # Le but est de corriger pour avoir la bonne température de cuisson au niveau de la grille
      - calibrate_linear:
          - 1000.0 -> 25.1   # 0°C
          - 1144.1 -> 105.5  # 37.8°C (Début Zone de fumage)
          - 1285.8 -> 188.3  # 76.7°C (Fin Zone de fumage)
          - 1385.1 -> 238.0  # 100°C (Point d'ébullition pour test)
          - 1572.0 -> 342.0  # 148.9°C (Zone de cuisson)
          - 1758.6 -> 460.3  # 204.4°C (Rôtissage)
          - 1957.5 -> 578.5  # 260.0°C (Saisissage)
          - 2165.2 -> 696.7  # 315.5°C (Nettoyage/Max BBQ)

      - offset: 0.0 # Si besoin de faire un petit calibrage de correction en °F

      # On lisse la température obtenue
      - median:
          window_size: 5 # On passe à 5 pour être plus robuste
          send_every: 1

      # 2. On ajoute le filtre de 1er ordre pour lisser la tendance
      - exponential_moving_average:
          alpha: 0.075 # Plus c'est petit, plus c'est lisse. 0.1 est un excellent compromis.
          send_every: 1

  # --- SONDE Aliment 1 (Sur A1) ---
  - platform: ads1115
    multiplexer: 'A1_GND'
    gain: 2.048
    id: meat_1_voltage
    name: "Voltage sonde 1"
    update_interval: 2.3s
    # Affichage sur page de diagnostique
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_volt_sonde_1
            text:
              format: "Volt Sonde 1: %.1f V"
              args: [ 'x' ]

# --- CAPTEUR DE RÉSISTANCE (La valeur brute en Ohms) ---
  - platform: resistance
    id: meat_1_res
    sensor: meat_1_voltage
    configuration: DOWNSTREAM
    resistor: 2135Ohm # Correction avec valeur réel de la 2200 Ohms
    name: "Résistance Sonde 1"
    unit_of_measurement: "Ω"
    accuracy_decimals: 1
    # Affichage sur page de diagnostique
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_res_sonde_1
            text:
              format: "Rés. Sonde 1: %.1f Ω"
              args: [ 'x' ]

# --- CAPTEUR DE TEMPÉRATURE (Calibré à partir de la résistance) ---
  - platform: copy
    source_id: meat_1_res
    id: meat_1
    name: "Temp. Sonde Aliment 1"
    unit_of_measurement: "°F"
    device_class: "temperature" # Dis à HA que c'est une température
    state_class: "measurement"  # Dis à HA que c'est une mesure
    accuracy_decimals: 1
    filters:
      # On convertit d'abord (très important)
      - calibrate_linear: # Sonde RTD PT1000
          # Valeurs standards PT1000 (très précises dans le range des sondes de viande)
          - 1000.0 -> 32.0   # 0°C (Référence glace)
          - 1144.1 -> 100.0  # 37.8°C (Zone critique début cuisson)
          - 1285.8 -> 170.0  # 76.7°C (Cible porc/volaille)
          - 1403.9 -> 225.0  # 107.2°C (Limite max viande)

      # AJOUT DE L'OFFSET (Correction via AHT25)
      # Si ta PT1000 affiche 74°F alors que l'AHT25 dit 72°F, 
      # ajoute un offset de -2.0 ici :

      - offset: 0.0  # Si besoin de faire un petit calibrage de correction en °F

      # On lisse la température obtenue
      - median: # Prend la valeur centrale sur 7 lectures pour éliminer les pics
          window_size: 7
          send_every: 1
      - sliding_window_moving_average:
          window_size: 25
          send_every: 1

      # On stabilise l'affichage
      - delta: 0.1 # Ignore les micro-variations de moins de 0.1°F pour éviter que l'écran saute sans arrêt


  # --- SONDE Aliment 2 (Sur A2) ---
  - platform: ads1115
    multiplexer: 'A2_GND'
    gain: 2.048
    id: meat_2_voltage
    name: "Voltage sonde 2"
    update_interval: 2.7s
    # Affichage sur page de diagnostique
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_volt_sonde_2
            text:
              format: "Volt Sonde 2: %.1f V"
              args: [ 'x' ]

# --- CAPTEUR DE RÉSISTANCE (La valeur brute en Ohms) ---
  - platform: resistance
    id: meat_2_res
    sensor: meat_2_voltage
    configuration: DOWNSTREAM
    resistor: 2185Ohm # Correction avec valeur réel de la 2200 Ohms 2173
    name: "Résistance Sonde 2"
    unit_of_measurement: "Ω"
    accuracy_decimals: 1
    # Affichage sur page de diagnostique
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_res_sonde_2
            text:
              format: "Rés. Sonde 2: %.1f Ω"
              args: [ 'x' ]

  # --- SONDE Aliment 2 (A2) ---
  - platform: copy
    source_id: meat_2_res
    id: meat_2
    name: "Temp. Sonde Aliment 2"
    unit_of_measurement: "°F"
    device_class: "temperature" # Dis à HA que c'est une température
    state_class: "measurement"  # Dis à HA que c'est une mesure
    accuracy_decimals: 1
    filters:
      # On convertit d'abord (très important)
      - calibrate_linear:
          # Valeurs standards PT1000 (très précises dans le range des sondes de viande)
          - 1000.0 -> 32.0   # 0°C (Référence glace)
          - 1144.1 -> 100.0  # 37.8°C (Zone critique début cuisson)
          - 1285.8 -> 170.0  # 76.7°C (Cible porc/volaille)
          - 1403.9 -> 225.0  # 107.2°C (Limite max viande)

      # AJOUT DE L'OFFSET (Correction via AHT25)
      # Si ta PT1000 affiche 74°F alors que l'AHT25 dit 72°F, 
      # ajoute un offset de -2.0 ici :

      - offset: 0.0  # Si besoin de faire un petit calibrage de correction en °F

      # On lisse la température obtenue
      - median: # Prend la valeur centrale sur 7 lectures pour éliminer les pics
          window_size: 7
          send_every: 1
      - sliding_window_moving_average:
          window_size: 25
          send_every: 1
          
      # On stabilise l'affichage
      - delta: 0.1 # Ignore les micro-variations de moins de 0.1°F pour éviter que l'écran saute sans arrêt

  # Valeur d'output du PID lissé vers le script de routing, permet d'éviter les glitch à la sortie pwm
  - platform: template
    id: pid_output_lisse
    name: "PID Output Lissé"
    unit_of_measurement: "%"
    icon: "mdi:gauge"
    internal: false
    filters:
      # alpha : plus la valeur est petite, plus c'est lisse.
      # 0.1 est un excellent point de départ pour un BBQ.
      - exponential_moving_average:
          alpha: 0.1
          send_every: 1
    on_value:
      then:
        - lambda: |-
            id(pid_output_level) = x; 
            id(update_auger_routing).execute();

  # valeur d'output du Prédicteur de Smith lissé vers le script de routing, permet d'éviter les glitch à la sortie pwm
  - platform: template
    id: smith_output_lisse
    name: "Smith Output Lissé"
    unit_of_measurement: "%"
    icon: "mdi:gauge"
    internal: false
    filters:
      - exponential_moving_average:
          alpha: 0.1
          send_every: 1
    on_value:
      then:
        - lambda: |-
            id(smith_output_level) = x;
            id(update_auger_routing).execute();

  # Pour monitorer la commande au pwn dans Home Assistant
  - platform: template
    id: auger_duty_pct
    name: "Sortie au PWM"
    unit_of_measurement: "%"
    state_class: "measurement"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      //return id(pid_output_level) * 100.0f;
      return id(actual_routing_output) * 100.0f;  // ← Lit la valeur réellement envoyée à la sortie

  - platform: template
    id: pid_kp
    name: "PID standard Proportionnel"
    unit_of_measurement: " "
    state_class: "measurement"
    accuracy_decimals: 6
    update_interval: 15s
    lambda: |-
      auto *pid_c = (pid::PIDClimate *)id(bbq_pid);
      float k = pid_c->get_kp();
      // Convertir kp_natif → gain pur pour affichage
      float k_provox = k * id(plage_procede);
      if (std::abs(k_provox - id(base_kp)) > 0.01f) return k_provox * 0.75f;
      return k_provox;
    on_value:
      then:
        - lambda: |-
            if (std::abs(x - id(base_kp)) > 0.01f) {
              id(autotune_active) = false;
            }
        - lvgl.label.update:
            id: lbl_pid_kp
            text:
              format: "%s P: %.2f"
              args: [ 'std::abs(((pid::PIDClimate *)id(bbq_pid))->get_kp() * id(plage_procede) - id(base_kp)) > 0.01f ? "Sug." : "Act."',
                      'x' ]

  - platform: template
    id: pid_ki
    name: "PID standard Intégral"
    unit_of_measurement: " "
    state_class: "measurement"
    accuracy_decimals: 6
    update_interval: 15s
    lambda: |-
      auto *pid_c = (pid::PIDClimate *)id(bbq_pid);
      float k = pid_c->get_ki();
      // Convertir ki_natif → rép/min pour affichage
      float k_provox = k * id(plage_procede) * 60.0f;
      if (std::abs(k_provox - id(base_ki)) > 0.01f) return k_provox * 0.416f;
      return k_provox;
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_pid_ki
            text:
              format: "%s I: %.3f"
              args: [ 'std::abs(((pid::PIDClimate *)id(bbq_pid))->get_ki() * id(plage_procede) * 60.0f - id(base_ki)) > 0.01f ? "Sug." : "Act."',
                      'x' ]

  - platform: template
    id: pid_kd
    name: "PID standard Dérivé"
    unit_of_measurement: " "
    state_class: "measurement"
    accuracy_decimals: 6
    update_interval: 15s
    lambda: |-
      auto *pid_c = (pid::PIDClimate *)id(bbq_pid);
      float k = pid_c->get_kd();
      if (std::abs(k - id(base_kd)) > 0.00001f) return k * 0.125f;
      return k;
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_pid_kd
            text:
              format: "%s D: %.5f"
              args: [ 'std::abs(((pid::PIDClimate *)id(bbq_pid))->get_kd() - id(base_kd)) > 0.00001f ? "Sug." : "Act."', 'x' ]

# ============================================================
  # SENSORS — Valeurs actives Smith ou PID natif + ratio t_ext
  # Affichent les valeurs réellement utilisées selon le mode actif.
  # Utile pour surveiller l'effet de la compensation t_ext.
  # ============================================================

  - platform: template
    id: smith_kp_actif
    name: "BBQ — Kp actif (gain pur)"
    unit_of_measurement: ""
    state_class: "measurement"
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      if (id(smith_active)) {
          // Mode Smith : Kp en gain pur avec ratio
          return id(base_kp) * id(ratio_ext_gel);
      } else {
          // Mode PID natif : convertir kp_natif → gain pur
          return ((pid::PIDClimate *)id(bbq_pid))->get_kp() * id(plage_procede);
      }

  - platform: template
    id: smith_ki_actif
    name: "BBQ — Ki actif (rép⁄min)"
    unit_of_measurement: "rép/min"
    state_class: "measurement"
    accuracy_decimals: 3
    update_interval: 15s
    lambda: |-
      if (id(smith_active)) {
          // Mode Smith : Ki en rép/min avec ratio
          return id(base_ki) * id(ratio_ext_gel);
      } else {
          // Mode PID natif : convertir ki_natif → rép/min
          return ((pid::PIDClimate *)id(bbq_pid))->get_ki() * id(plage_procede) * 60.0f;
      }

  - platform: template
    id: ratio_compensation_actif
    name: "BBQ — Ratio compensation T°ext"
    unit_of_measurement: " "
    state_class: "measurement"
    accuracy_decimals: 3
    update_interval: 60s
    lambda: |-
      return id(ratio_ext_gel);

binary_sensor:
  - platform: template
    id: vis_en_mouvement
    name: "Vis en mouvement"

  - platform: template
    id: err_sonde_cuve
    name: "Alerte Sonde Cuve"
    device_class: problem

  - platform: template
    id: err_allumage
    name: "Alerte Échec Allumage"
    device_class: problem

  - platform: template
    id: err_surchauffe
    name: "Alerte Surchauffe"
    device_class: problem

  # Senseur de détection de la porte de la trémie ouverte
  - platform: template
    id: porte_tremie
    name: "Trémie État Porte"
    device_class: door
    lambda: |-
      float dist = id(granules_mm).state;
      if (std::isnan(dist)) return false;
      // Quand porte ouverte, le capteur voit très loin ou NaN
      // Ajuste le seuil selon ta trémie vide (ex: fond à ~300mm)
      return dist > 600.0;

# --- LOGIQUE ET RELAIS ---
globals:
  - id: is_igniting
    type: bool
    initial_value: 'false'
  # Vrai pendant la phase de pré-refroidissement (300°F -> cible 225°F)
  # au tout début de seq_arret, avant le reste de la séquence d'arrêt.
  - id: pre_cooldown_active
    type: bool
    initial_value: 'false'
  - id: is_cooling
    type: bool
    initial_value: 'false'
  - id: is_priming
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: manual_prime_active
    type: bool
    initial_value: 'false'
  - id: safety_shutdown
    type: bool
    initial_value: 'false'

  # --- MODE PURGE VIS (vidange de fines particules ou remplissage trémie) ---
  - id: purge_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: purge_remaining_s
    type: int
    restore_value: no
    initial_value: '0'
  - id: purge_igniter_used
    type: bool
    restore_value: no
    initial_value: 'false'

  # Valeurs de base issues de l'autotune (Rule 'No Overshoot PID')
  - id: autotune_active
    type: bool
    initial_value: 'false'
  - id: base_kp
    type: float
    initial_value: '0.4' # Gain exprimé style Cntrl Industriel ancien 0.002 x plage_procede
  - id: base_ki
    type: float
    initial_value: '0.15' # Intégral exprimé style Cntrl Industriel (rep/min) ancien 0.00001 x plage_procede x 60
  - id: base_kd
    type: float
    initial_value: '0.0' # Valeur PI
  - id: plage_procede
    type: float
    restore_value: no
    initial_value: '450.0'   # SP_max - SP_min = 600 - 150 = 450°F

  # Pour synchronisation des entrées de pid HA vers les variables globales de pid
  - id: pid_sync_ready
    type: bool
    initial_value: 'false'

  # Valeurs min et max de la sortie du pid
  - id: pid_sortie_min
    type: float
    restore_value: yes
    initial_value: '0.07'   # valeur initiale de 10% minimum

  - id: pid_sortie_max
    type: float
    restore_value: yes
    initial_value: '0.50'   # valeur initiale de 50% maximum

  # Variables pour le mode fumée
  - id: smoke_mode_active
    type: bool
    initial_value: 'false'
  - id: smoke_intensity
    type: float
    initial_value: '0.11' # Valeur par défaut (11%) pour peu de fumée, combustion vive
  - id: smoke_temp_min
    type: float
    initial_value: '150.0'

# requise pour antiburn avec logo pitboss
  - id: logo_x
    type: int
    initial_value: '400'
  - id: logo_y
    type: int
    initial_value: '200'
  - id: logo_dx
    type: int
    initial_value: '4' # Vitesse horizontale
  - id: logo_dy
    type: int
    initial_value: '4' # Vitesse verticale

# Variable pour manipulation de la sortie vers la vis
  - id: pid_output_level
    type: float
    initial_value: '0.0'
    
  - id: actual_routing_output
    type: float
    restore_value: no
    initial_value: '0.0'
    
  # --- Variables d'état internes du Prédicteur de Smith ---
  # Ces variables remplacent celles du PID natif pour le calcul Smith.
  # Elles sont remises à zéro lors du passage en mode HEAT (voir seq_depart).
  - id: pid_integral
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: pid_last_error
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: pid_last_temp
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: pid_last_time
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: smith_output_level
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: smith_roc_last
    type: float
    restore_value: no
    initial_value: '0.0'

  # --- Flag d'activation du Prédicteur de Smith ---
  # Contrôlé via le switch HA smith_predictor_active.
  # true  → Le script Smith calcule la sortie, kp/ki/kd natifs forcés à 0
  # false → Le PID natif ESPHome calcule normalement via pid_output_level
  - id: smith_active
    type: bool
    restore_value: yes      # On mémorise le choix entre les redémarrages
    initial_value: 'true'

  # --- Flag d'activation de la compensation selon température extérieur ---
  - id: adapt_temp_ext_active
    type: bool
    restore_value: yes
    initial_value: 'true'

  # Pour possibilité accès du ratio de compensation maximum en cas de temp. extérieur froide via HA
  - id: ratio_max_temp_ext
    type: float
    restore_value: yes
    initial_value: '1.0'

  # Ratio de compensation température extérieure — gelé quand BBQ en marche
  # Utilisé pendant toute la cuisson pour stabiliser les coefficients.
  # Valeur par défaut 1.0 = pas de compensation (équivalent 20°C)
  - id: ratio_ext_gel
    type: float
    restore_value: yes      # On mémorise le dernier ratio entre les redémarrages
    initial_value: '1.0'

  # Vrai si l'API n'était toujours pas connectée 20s après le boot.
  # Utilisé pour déclencher un reboot unique dès que l'API se connecte
  # enfin, afin d'imiter les conditions d'une réparation manuelle.
  - id: api_was_absent_at_boot
    type: bool
    restore_value: no
    initial_value: "false"
  
################################################################################
# NOTES DE CALIBRATION — Smith Predictor
#
# PROCÉDURE RECOMMANDÉE pour trouver tau et theta :
#
# 1. Lancer le BBQ normalement jusqu'à stabilisation à une température cible.
#
# 2. Activer le Smith Predictor via HA (switch ON).
#
# 3. Faire un échelon de set_point (+20°F ou +30°F) et observer dans les logs
#    (niveau DEBUG, tag "SMITH") les valeurs PV, Pred, et Out.
#
# THETA (délai de résultat de la combustion (secondes)) :
#         Temps entre l'activation de la vis et l'effet mesurable sur la sonde.
#         Valeur typique : 40-80s selon charge et température.
#   - Dans les logs, note le temps entre une variation de "Out" et le début
#     de la montée de "PV". C'est theta.
#   - Typique BBQ granules : 40-80 secondes.
#                            sur mon BBQ le theta est de 140s
#
# TAU (constante de temps thermique du BBQ (secondes)) :
#         Représente le temps que met la chambre à atteindre 63% de sa
#         réponse finale après un échelon d'entrée. Valeur typique : 120-220s.
#   - Depuis le début de la montée, note le temps pour atteindre 63% de
#     la variation finale de température. C'est tau.
#   - Typique BBQ : 120-220 secondes selon la masse thermique.
#                   sur mon BBQ le tau est de 240s
#
# CONSEIL : Commencer avec theta=50s, tau=120s, puis affiner.
#           Augmenter theta si le PID réagit trop tôt (overshoot).
#           Diminuer theta si la régulation est trop lente.
################################################################################
  
  - id: smith_tau
    type: float
    restore_value: yes
    initial_value: '240.0'   # À calibrer selon ton BBQ

  - id: smith_theta
    type: float
    restore_value: yes
    initial_value: '140.0'   # À calibrer selon ton BBQ

# Entrées numérique, permet ajustement des paramètres via HA et servewur Web
number:
  - platform: template
    id: purge_duration_min
    name: "Purge Vis - Durée (min)"
    icon: "mdi:timer-sand"
    mode: BOX
    min_value: 1
    max_value: 10   # Plafond dur appliqué aussi côté firmware, voir seq_purge_vis
    step: 1
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 5
    entity_category: "config"

  - platform: template
    id: tuner_kp
    name: "PID Kp (Gain)"
    icon: "mdi:numeric"
    mode: BOX
    min_value: 0.1
    max_value: 5.0
    step: 0.05
    unit_of_measurement: ""
    optimistic: true
    entity_category: "config"
    on_value:
      then:
        - lambda: |-
            if (id(pid_sync_ready) && x != id(base_kp)) {
              id(base_kp) = x;
              // Si PID natif actif, convertir en unités ESPHome
              if (!id(smith_active)) {
                  auto *pid_c = (pid::PIDClimate *)id(bbq_pid);
                  pid_c->set_kp(x / id(plage_procede));
              }
              id(update_auger_routing).execute();
              ESP_LOGD("TUNER", "Kp mis à jour: %.2f (gain pur)", x);
            }

  - platform: template
    id: tuner_ki
    name: "PID Ki (Intégral rép⁄min)"
    icon: "mdi:numeric"
    mode: BOX
    min_value: 0.01
    max_value: 2.0
    step: 0.01
    unit_of_measurement: ""
    optimistic: true
    entity_category: "config"
    on_value:
      then:
        - lambda: |-
            if (id(pid_sync_ready) && x != id(base_ki)) {
              id(base_ki) = x;
              // Si PID natif actif, convertir en unités ESPHome
              if (!id(smith_active)) {
                  auto *pid_c = (pid::PIDClimate *)id(bbq_pid);
                  pid_c->set_ki(x / (id(plage_procede) * 60.0f));
              }
              id(update_auger_routing).execute();
              ESP_LOGD("TUNER", "Ki mis à jour: %.3f rép/min", x);
            }

  - platform: template
    id: tuner_kd
    name: "PID Kd (Dérivé)"
    icon: "mdi:numeric"
    mode: BOX
    min_value: 0.0
    max_value: 2.0
    step: 0.01
    optimistic: true
    entity_category: "config"
    on_value:
      then:
        - lambda: |-
            if (id(pid_sync_ready) && x != id(base_kd)) {
              id(base_kd) = x;
              auto *pid_c = (pid::PIDClimate *)id(bbq_pid);
              pid_c->set_kd(x);
              id(update_auger_routing).execute();
              ESP_LOGD("TUNER", "Kd mis à jour: %.5f", x);
            }

  # ============================================================
  # NUMBER — Sortie minimum
  # restore_value: true : survit aux flashs via système ESPHome
  # ============================================================
  - platform: template
    id: sortie_min
    name: "Sortie Min."
    icon: "mdi:chevron-double-down"
    mode: BOX
    min_value: 5.0
    max_value: 30.0
    step: 1.0
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true                 # ← survit aux flashs
    entity_category: "config"
    initial_value: 10.0                 # Utilisé seulement au 1er flash
    on_value:
      then:
        - lambda: |-
            id(pid_sortie_min) = x / 100.0f;
            // Reset intégrale pour éviter un état sale après changement de limite
            // Une intégrale négative accumulée pendant le blocage causerait
            // un gel de la sortie jusqu'à ce qu'elle se résorbe naturellement
            if (id(smith_active)) {
                id(pid_integral) = 0.0f;
                id(smith_roc_last) = 0.0f;
            }
            ESP_LOGD("SMITH", "Sortie minimum mis à jour: %.1f%%", x);

  # ============================================================
  # NUMBER — Sortie maximum
  # restore_value: true : survit aux flashs via système ESPHome
  # ============================================================
  - platform: template
    id: sortie_max
    name: "Sortie Max."
    icon: "mdi:chevron-double-up"
    mode: BOX
    min_value: 40.0
    max_value: 100.0
    step: 1.0
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true                 # ← survit aux flashs
    entity_category: "config"
    initial_value: 50.0                 # Utilisé seulement au 1er flash
    on_value:
      then:
        - lambda: |-
            id(pid_sortie_max) = x / 100.0f;
            // Reset intégrale pour éviter un état sale après changement de limite
            // Une intégrale négative accumulée pendant le blocage causerait
            // un gel de la sortie jusqu'à ce qu'elle se résorbe naturellement
            if (id(smith_active)) {
                id(pid_integral) = 0.0f;
                id(smith_roc_last) = 0.0f;
            }
            ESP_LOGD("SMITH", "Sortie maximum mis à jour: %.1f%%", x);


  # ============================================================
  # NUMBER — tuner_smith_tau (corrigé)
  # restore_value: true : survit aux flashs via système ESPHome
  # ============================================================
  - platform: template
    id: tuner_smith_tau
    name: "Smith Const. temps(tau)"
    icon: "mdi:timer-sand"
    mode: BOX
    min_value: 120.0
    max_value: 300.0
    step: 5.0
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true                 # ← survit aux flashs
    entity_category: "config"
    initial_value: 240.0                 # Utilisé seulement au 1er flash
    on_value:
      then:
        - lambda: |-
            id(smith_tau) = x;
            ESP_LOGD("SMITH", "tau mis à jour: %.1f s", x);


  # ============================================================
  # NUMBER — tuner_smith_theta (corrigé)
  # restore_value: true : survit aux flashs via système ESPHome
  # ============================================================
  - platform: template
    id: tuner_smith_theta
    name: "Smith Délai transport (theta)"
    icon: "mdi:timer-play-outline"
    mode: BOX
    min_value: 30.0
    max_value: 150.0
    step: 5.0
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true                 # ← survit aux flashs
    entity_category: "config"
    initial_value: 140.0                 # Utilisé seulement au 1er flash
    on_value:
      then:
        - lambda: |-
            id(smith_theta) = x;
            ESP_LOGD("SMITH", "theta mis à jour: %.1f s", x);

  # ============================================================
  # NUMBER — ratio_max_temp_ext
  # restore_value: true : survit aux flashs via système ESPHome
  # ============================================================
  - platform: template

    on_value:
      then:
        - lambda: |-
            id(ratio_max_temp_ext) = x;
            ESP_LOGD("SMITH", "Ratio max. comp. temp. extérieur mis à jour: %.1f", x);

button:
  # Permet l'arrêt du BBQ à distance
  - platform: template
    name: "Arrêt BBQ"
    id: btn_stop_ha
    icon: "mdi:power-off"
    on_press:
      then:
        - script.execute: seq_arret

# Bouton de redémarrage interne, utilisé uniquement par l'automation
# api.on_client_connected ci-dessus (voir globals: api_was_absent_at_boot).
# Non exposé à Home Assistant (internal: true).
  - platform: restart
    name: "Reboot (API absente au boot)"
    id: panel_reboot_on_late_api
    internal: true

#-------------------------------------------
# Sortie discrete
#-------------------------------------------
switch:
# Switch Antiburn
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    disabled_by_default: true
    turn_on_action:
      - logger.log: "Starting Antiburn"
      # Affiche logo pitboss flottant
      - lvgl.widget.show: antiburn_curtain  # On tire le rideau
      - lvgl.widget.show: container_antiburn # On affiche le logo
      - lvgl.widget.hide: nav_matrix # On cache le menu de navigation dans le bas de la page
      - light.control:
          id: lcd_backlight
          brightness: 25%

    turn_off_action:
      - logger.log: "Stopping Antiburn"
      # Cache le logo Pitboss et allume rétro à 100%
      - lvgl.widget.hide: container_antiburn
      - lvgl.widget.hide: antiburn_curtain   # On range le rideau
      - lvgl.widget.show: nav_matrix # On cache le menu de navigation dans le bas de la page
      - light.turn_on:
          id: lcd_backlight
          brightness: 100%
          
  # ============================================================
  # SWITCH — smith_predictor_active (corrigé)
  # optimistic: true + restore_mode gère la persistance
  # indépendamment de la NVS des globales (survit aux flashs)
  # ============================================================
  - platform: template
    id: smith_predictor_active
    name: "Prédicteur de Smith"
    icon: "mdi:chart-timeline-variant-shimmer"
    entity_category: "config"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON    # ON par défaut, mémorisé entre flashs

    turn_on_action:
      - lambda: |-
          id(smith_active) = true;
          auto *pid_c = (pid::PIDClimate *)id(bbq_pid);
          pid_c->set_kp(0.0f);
          pid_c->set_ki(0.0f);
          pid_c->set_kd(0.0f);
          id(pid_integral)   = 0.0f;
          id(pid_last_error) = 0.0f;
          id(pid_last_temp)  = id(bbq_temp_pv).state;
          id(pid_last_time)  = 0;
          ESP_LOGI("SMITH", "Prédicteur de Smith ACTIVÉ — PID natif neutralisé");
      - script.execute: update_auger_routing

    turn_off_action:
      - lambda: |-
          id(smith_active) = false;
          auto *pid_c = (pid::PIDClimate *)id(bbq_pid);
          // Conversion unités PROVOX → ESPHome pour PID natif
          pid_c->set_kp(id(base_kp) / id(plage_procede));
          pid_c->set_ki(id(base_ki) / (id(plage_procede) * 60.0f));
          pid_c->set_kd(0.0f);
          pid_c->reset_integral_term();
          ESP_LOGI("SMITH", "Prédicteur de Smith DÉSACTIVÉ — PID natif restauré "
                   "Kp_natif:%.5f Ki_natif:%.6f",
                   id(base_kp) / id(plage_procede),
                   id(base_ki) / (id(plage_procede) * 60.0f));
      # Forcer une mise à jour immédiate de la vis avec le nouveau mode
      - script.execute: update_auger_routing


  # ============================================================
  # SWITCH — Activation compensation selon température extérieur
  # optimistic: true + restore_mode gère la persistance
  # indépendamment de la NVS des globales (survit aux flashs)
  # ============================================================
  - platform: template
    id: switch_adapt_temp_ext
    name: "Compensation température extérieure"
    icon: "mdi:thermometer-auto"
    entity_category: "config"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(adapt_temp_ext_active) = true;
          ESP_LOGI("ADAPT", "Compensation t_ext ACTIVÉE");
    turn_off_action:
      - lambda: |-
          id(adapt_temp_ext_active) = false;
          id(ratio_ext_gel) = 1.0f;
          ESP_LOGI("ADAPT", "Compensation t_ext DÉSACTIVÉE — ratio forcé à 1.0");
      - script.execute: update_auger_routing

# Rétro-éclairage              
  - platform: gpio
    id: backlight_enable
    restore_mode: ALWAYS_ON
    pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 2
      mode: { output: true }

# Ventilateur      
  - platform: gpio
    id: fan_relay
    name: "BBQ Ventilateur"
    pin:
      mcp23xxx: mcp_hub # C'est ici la correction : _id
      number: 0
      mode: OUTPUT
    on_turn_on:
      - script.execute: stop_antiburn
      - script.execute: start_antiburn_temporise
    on_turn_off:
      - script.execute: stop_antiburn
      - script.execute: start_antiburn_temporise
# Allumeur
  - platform: gpio
    id: igniter_relay
    name: "BBQ Allumeur"
    pin:
      mcp23xxx: mcp_hub
      number: 1
      mode: OUTPUT
    # --- SÉCURITÉ : VERROUILLAGE AVEC LE VENTILATEUR ---
    on_turn_on:
      - if:
          condition:
            switch.is_off: fan_relay
          then:
            - switch.turn_off: igniter_relay
            - logger.log: "ERREUR CRITIQUE: Tentative d'allumage sans ventilateur !"
            - lvgl.obj.update:
                id: main_page
                bg_color: 0xE65100 # Orange foncé pour alerte
# Chauffage du boitier
  - platform: gpio
    id: ptc_heater
    name: "Chauffage Boitier"
    pin:
      mcp23xxx: mcp_hub
      number: 2
      mode: OUTPUT


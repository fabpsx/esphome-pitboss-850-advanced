#-------------------------------------------
# Paramètrage de l'écran tactile gt911
#-------------------------------------------
touchscreen:
  platform: gt911
  id: my_touchscreen
  display: lcd7b
  i2c_id: bus_a
  interrupt_pin: GPIO4
  # setup_priority abaissée volontairement : on retarde l'exécution du
  # setup() du GT911 (qui pulse reset_pin via le hub CH32V003 en I2C)
  # pour laisser au CH32V003 le temps de terminer son propre boot
  # interne après une remise sous tension. Sans ce délai, lors d'un
  # retour de courant après une panne, le hub peut ne pas encore
  # répondre sur I2C au moment où ce setup() s'exécute, ce qui laisse
  # le GT911 sans reset correct et donc insensible au toucher, même si
  # l'écran s'affiche normalement et que le reste démarre bien.
  setup_priority: -100
  reset_pin:
    waveshare_io_ch32v003: waveshare_io_hub
    number: 1
    mode: OUTPUT
  on_touch:
    then:
      - script.execute: stop_antiburn
      - script.execute: start_antiburn_temporise    

#-------------------------------------------
# Paramètrage de l'écran
#-------------------------------------------
display:
  - platform: mipi_rgb # ancien:rpi_dpi_rgb
    id: lcd7b
    model: RPI
    # Panel geometry + pixel clock
    dimensions: { width: 1024, height: 600 }
    pclk_frequency: 30MHz
    pclk_inverted: true
    color_order: RGB
    rotation: 0

    # Sync timings (work well on this panel)
    hsync_pulse_width: 20
    hsync_back_porch: 160
    hsync_front_porch: 160
    vsync_pulse_width: 3
    vsync_back_porch: 23
    vsync_front_porch: 12

    # Control pins
    de_pin: 5
    pclk_pin: 7
    hsync_pin: { number: 46, ignore_strapping_warning: true }
    vsync_pin: { number: 3,  ignore_strapping_warning: true }

    # Panel reset is routed through Waveshare CH32V003
    reset_pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 3

    # RGB565 data bus (LSB→MSB) — verified mapping for 7B
    data_pins:
      red:   [1, 2, 42, 41, 40]
      green: [39, 0, 45, 48, 47, 21]
      blue:  [14, 38, 18, 17, 10]

    # Draw once per second (could be 'never' + on_boot fill)
    update_interval: 1s


#-------------------------------------------
# Affichage des pages graphique
#-------------------------------------------
lvgl:
  displays: [lcd7b]
  # 2. Déclencheur global (au même niveau que displays)

  style_definitions:
# Style pour boutons inactif
    - id: style_disabled
      bg_color: 0x808080 # Gris moyen
      bg_opa: COVER

# Style pour entête et bas de page
    - id: header
      bg_color: 0x002D42
      bg_grad_color: 0x005782
      bg_grad_dir: VER
      bg_opa: COVER
      border_opa: TRANSP
      radius: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      border_color: 0x0077b3
      text_color: 0xFFFFFF
      text_font: montserrat_fr_36
      width: 100%
      height: 40

# Style pour entête et bas de page
    - id: footer
      bg_color: 0x005782
      bg_grad_color: 0x002D42
      bg_grad_dir: VER
      bg_opa: COVER
      border_opa: TRANSP
      radius: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      border_color: 0x0077b3
      text_color: 0xFFFFFF
      text_font: montserrat_36
      width: 100%
      height: 40

    - id: style_transparent
      bg_opa: TRANSP # Rend l'arrière-plan transparent
      border_width: 0 # Supprime les bordures
      shadow_width: 0 # Supprime l'ombre
      outline_width: 0 # Supprime la doublure de la bordure
      radius: 0 # Supprimer l'arrondi si désiré

# Style objet sur rectangle arrondi sur fond gris avec ombre
    - id: style_obj_fond_gris
      bg_opa: COVER
      bg_color: ${color_bg_obj}
      border_color: ${color_black}
      border_width: 3
      shadow_color: ${color_grey_moy}
      shadow_opa: 100%
      shadow_width: 10
      shadow_offset_x: 7
      shadow_offset_y: 7 
      radius: 20 
      pad_all: 0

# Style bouton sur rectangle arrondi avec ombre
    - id: style_btn
      border_color: ${color_black}
      border_width: 3
      shadow_color: ${color_grey_moy}
      shadow_opa: 100%
      shadow_width: 10
      shadow_offset_x: 5
      shadow_offset_y: 5 
      radius: 10 
      pad_all: 0

# Boutons de navigation dans le bas de chaque page
  top_layer:
    widgets:
      # 1. Le rideau noir (1024x600)
      - obj:
          id: antiburn_curtain
          width: 1024
          height: 600
          hidden: true
          bg_color: 0x000000  # Noir pur
          bg_opa: 100%
          border_width: 0
          radius: 0

      # 2. Le logo qui bouge
      - obj:
          id: container_antiburn
          width: 250
          height: 200
          hidden: true
          bg_opa: 0%
          border_width: 0
          # Ajoutez ces lignes pour supprimer les marges internes :
          pad_all: 0
          pad_top: 0
          pad_bottom: 0
          pad_left: 0
          pad_right: 0
          widgets:
            - image:
                src: img_logo_antiburn
                # Optionnel : forcer l'alignement au centre
                align: center 

      - buttonmatrix:
          align: bottom_mid
          styles: footer
          pad_all: 0
          outline_width: 0
          id: nav_matrix
          items:
            styles: footer
          rows:
            - buttons:
              - id: page_prev
                text: "\uF053"
                on_press:
                  then:
                    lvgl.page.previous:
              - id: page_home
                text: "\uF015"
                on_press:
                  then:
                    lvgl.page.show: main_page
              - id: page_next
                text: "\uF054"
                on_press:
                  then:
                    - lvgl.page.next:

    # Heure courante
      - label:
          id: lbl_current_time
          x: 890
          y: 545
          text_font: font_time
          text: " "

  bg_color: ${color_bg}

  # Début des pages graphique
  pages:
    - id: main_page
      widgets:
        # --- Entête de la page ---
        - obj:
            align: TOP_MID
            styles: header
            widgets:
              - label:
                  text_font: montserrat_fr_36
                  text: "Contrôle"
                  align: CENTER
                  text_align: CENTER
                  text_color: 0xFFFFFF

        # Affichage de l'état de la connection wifi
        - label:
            id: lbl_wifi
            text_color: 0xFFFFFF
            text: "WiFi..."
            x: 10
            y: 4
        - label:
            id: lbl_ip
            text_color: 0xFFFFFF
            text: "IP: en attente"
            x: 60
            y: 4   

            # --- ZONE CONTRÔLE TEMPÉRATURE DU BBQ ---
        - obj:
            id: controle_pid
            styles: style_obj_fond_gris
            pad_all: 0
            x: 10
            y: 50
            width: 475
            height: 500
            bg_opa: 100%
            widgets:
              # ARC 1 : Affiche le PV (remplissage orange, pas de bouton)
              - arc:
                  id: arc_pv
                  align: CENTER
                  y: 30
                  width: 400
                  height: 400
                  arc_width: 30
                  min_value: 150
                  max_value: 500
                  value: 180 # Sera mis à jour par le PV
                  adjustable: false
                  arc_color: 0x292929 # Fond gris
                  indicator:
                    arc_color: 0xFF6F22 # Remplissage orange
                  knob:
                    bg_opa: 0% # Cache le bouton de cet arc                         
              # ARC 2 : Affiche le SP (bouton blanc, pas de remplissage)
              - arc:
                  id: arc_sp
                  align: CENTER
                  y: 30
                  adjustable: true
                  value: 0 # relié au (PV)
                  min_value: 150
                  max_value: 500
                  width: 400
                  height: 400
                  arc_width: 30
                  arc_color: 0x292929
                  indicator:
                    arc_opa: 0% # Cache le remplissage orange de l'arc de (SP)
                    #arc_color: 0xFF6F22 # Remplissage orange (PV)
                    arc_width: 30
                  knob:
                    bg_color: 0xFFFFFF # Rond Blanc relié au (SP)
                  on_value:
                    then:
                      - climate.control: 
                          id: bbq_pid
                          # On arrondit la valeur glissée (x) au multiple de 5 le plus proche
                          target_temperature: !lambda "return (round(x / 5.0) * 5.0);"

                      - lambda: |-
                          // On récupère la valeur arrondie pour la suite
                          float target_arrondi = round(x / 5.0) * 5.0;
                          auto *lbl = id(lbl_selection_live);

                          // 1. Forcer l'arc à se recaler visuellement sur le multiple de 5
                          lv_arc_set_value(id(arc_sp), (int)target_arrondi);

                          // 2. Rendre le label visible et mettre à jour le texte
                          lv_obj_clear_flag(lbl, LV_OBJ_FLAG_HIDDEN);
                          lv_label_set_text(lbl, esphome::str_sprintf("Cible: %.0f°F", target_arrondi).c_str());

                          // 3. Mettre à jour le dropdown si c'est un preset
                          std::string val_str = esphome::str_sprintf("%.0f°F", target_arrondi);
                          id(select_temp_preset).set_selected_text(val_str.c_str(), LV_ANIM_ON);

                      - script.execute: cacher_label_selection

              - label:
                  id: lbl_titre
                  align: TOP_MID
                  y: 5
                  text: "Température du BBQ"
                  text_font: montserrat_bold_fr_36

              - dropdown:
                  id: select_temp_preset
                  text_font: montserrat_bold_fr_30
                  symbol: "▼" # Le triangle reste à droite par défaut
                  # On ajoute l'unité °F directement dans les options
                  options: ["150°F", "180°F", "200°F", "225°F", "250°F", "275°F", "300°F", "325°F", "350°F", "375°F", "400°F", "425°F", "450°F", "475°F", "500°F"]
                  width: 140 # Largeur ajustée pour ajout de °F à la fin
                  height: 65
                  align: CENTER
                  y: -60
                  on_click: 
                    lambda: |-
                      auto * list = lv_dropdown_get_list(id(select_temp_preset).obj);
                      if (list != nullptr) {
                          lv_obj_set_style_text_font(list, montserrat_fr_30, 0);
                      }
                  on_value:
                    then:
                      - lambda: |-
                          // 1. Récupérer le texte (ex: "180°F")
                          std::string selected_text = id(select_temp_preset).get_selected_text();

                          // 2. Conversion intelligente
                          // atof lit les chiffres et s'arrête net dès qu'il voit "°"
                          float target = std::atof(selected_text.c_str());

                          // 3. Mettre à jour le thermostat (PID)
                          auto call = id(bbq_pid).make_call();
                          call.set_target_temperature(target);
                          call.perform();  
                               
                          // 4. Synchroniser l'Arc
                          lv_arc_set_value(id(arc_sp), (int)target);

                          ESP_LOGD("DROPDOWN", "Texte: %s -> Float: %.1f", selected_text.c_str(), target);

              - label:
                  id: lbl_pv
                  align: CENTER
                  text: "--°F"
                  text_font: montserrat_bold_fr_80
                  text_color: ${color_pv}
                  y: 30  

              # Bouton MOINS (-)
              - button:
                  align: CENTER
                  x: -50   # Positionné à gauche sous l'arc (ajuste selon ton goût)
                  y: 110
                  width: 70
                  height: 70
                  radius: 35
                  bg_color: ${color_bg_obj2}
                  border_width: 2
                  border_color: 0x000000
                  widgets:
                    - label: { text: "-", align: CENTER, text_font: roboto_60, text_color: 0x000000 }
                  on_click:
                    - climate.control:
                        id: bbq_pid
                        target_temperature: !lambda "return id(bbq_pid).target_temperature - 5;"
                    # --- METS À JOUR L'ARC, LE DROPDOWN ET LA VALEUR SÉLECTIONNÉ NON PRÉSETTÉ ---
                    - lambda: |-
                        float target = id(bbq_pid).target_temperature;
                        // 1. Synchroniser l'Arc
                        lv_arc_set_value(id(arc_sp), (int)target);

                        // 2. Vérifier si c'est un preset
                        std::vector<int> presets = {150, 180, 200, 225, 250, 275, 300, 325, 350, 375, 400, 425, 450, 475, 500};
                        bool is_preset = std::find(presets.begin(), presets.end(), (int)target) != presets.end();

                        if (is_preset) {
                            // C'est un preset : on met à jour le dropdown et cache le label live
                            std::string val_str = esphome::str_sprintf("%.0f°F", target);
                            id(select_temp_preset).set_selected_text(val_str.c_str(), LV_ANIM_ON);
                            lv_obj_add_flag(id(lbl_selection_live), LV_OBJ_FLAG_HIDDEN);
                        } else {
                            // Pas un preset : on affiche le label live avec la valeur
                            lv_obj_clear_flag(id(lbl_selection_live), LV_OBJ_FLAG_HIDDEN);
                            lv_label_set_text(id(lbl_selection_live), esphome::str_sprintf("Cible: %.0f°F", target).c_str());
                        }
                    # Optionnel : cache le label après 3 secondes s'il est affiché
                    - script.execute: cacher_label_selection

              # Bouton PLUS (+)
              - button:
                  align: CENTER
                  x: 50  # Positionné à droite sous l'arc
                  y: 110
                  width: 70
                  height: 70
                  radius: 35
                  bg_color: ${color_bg_obj2}
                  border_width: 2
                  border_color: 0x000000
                  widgets:
                    - label: { text: "+", align: CENTER, text_font: roboto_60, text_color: 0x000000 }
                  on_click:
                    - climate.control:
                        id: bbq_pid
                        target_temperature: !lambda "return id(bbq_pid).target_temperature + 5;"
                    # --- METS À JOUR L'ARC, LE DROPDOWN ET LA VALEUR SÉLECTIONNÉ NON PRÉSETTÉ ---
                    - lambda: |-
                        float target = id(bbq_pid).target_temperature;
                        // 1. Synchroniser l'Arc
                        lv_arc_set_value(id(arc_sp), (int)target);

                        // 2. Vérifier si c'est un preset
                        std::vector<int> presets = {150, 180, 200, 225, 250, 275, 300, 325, 350, 375, 400, 425, 450, 475, 500};
                        bool is_preset = std::find(presets.begin(), presets.end(), (int)target) != presets.end();

                        if (is_preset) {
                            // C'est un preset : on met à jour le dropdown et cache le label live
                            std::string val_str = esphome::str_sprintf("%.0f°F", target);
                            id(select_temp_preset).set_selected_text(val_str.c_str(), LV_ANIM_ON);
                            lv_obj_add_flag(id(lbl_selection_live), LV_OBJ_FLAG_HIDDEN);
                        } else {
                            // Pas un preset : on affiche le label live avec la valeur
                            lv_obj_clear_flag(id(lbl_selection_live), LV_OBJ_FLAG_HIDDEN);
                            lv_label_set_text(id(lbl_selection_live), esphome::str_sprintf("Cible: %.0f°F", target).c_str());
                        }
                    # Optionnel : cache le label après 3 secondes s'il est affiché
                    - script.execute: cacher_label_selection

              - label:
                  id: lbl_selection_live
                  align: TOP_MID
                  y: 38 
                  text: "Réglage..."
                  hidden: true # Caché par défaut
                  text_font: montserrat_bold_fr_30
                  text_color: 0xFFFFFF


              # Ventilateur (mode_fan)
              - obj:
                  id: box_fan_icon
                  border_color: ${color_grey_moy}
                  border_width: 2
                  radius: 5
                  pad_all: 0
                  align: BOTTOM_MID
                  x: -75
                  y: -10
                  width: 65
                  height: 65
                  bg_opa: 0% 
                  widgets:
                    - label: 
                        id: lbl_fan_icon
                        align: CENTER
                        text: "\uF168"
                        text_color: ${color_off}
                        text_font: icon_font_lg

              # Allumeur (flare)
              - obj:
                  id: box_igniter_icon
                  border_color: ${color_grey_moy}
                  border_width: 2
                  radius: 5 
                  pad_all: 0
                  align: BOTTOM_MID
                  x: 0
                  y: -10
                  width: 65
                  height: 65
                  bg_opa: 0% 
                  widgets:
                    - label: 
                        id: lbl_igniter_icon
                        align: CENTER
                        text: "\uE3E4" # Note: 'flare' est généralement E3E4
                        text_color: ${color_off}
                        text_font: icon_font_lg

              # Vis d'alimentation (rule_settings)
              - obj:
                  id: box_auger_icon
                  border_color: ${color_grey_moy}
                  border_width: 2
                  radius: 5 
                  pad_all: 0
                  align: BOTTOM_MID
                  x: 75
                  y: -10
                  width: 65
                  height: 65
                  bg_opa: 0% 
                  widgets:
                    - label: 
                        id: lbl_auger_icon
                        align: CENTER
                        text: "\uF64C" # Note: 'rule_settings' est F64C
                        text_color: ${color_off}
                        text_font: icon_font_lg             

        # --- Bouton de Mode Fumée ---
        - button:
            id: btn_smoke_toggle
            styles: style_btn
            x: 785
            y: 360
            width: 200
            height: 50
            bg_color: 0x607D8B # Couleur ardoise
            on_click:
              then:
                - if:
                    condition:
#                      lambda: |-
#                        // Autorisé si en Allumage, en Régulation (HEAT) ou si déjà en mode Fumée
#                        return (id(is_igniting) || id(bbq_pid).mode == climate::CLIMATE_MODE_HEAT || id(smoke_mode_active));
                      lambda: |-
                        // Autorisé si en Allumage, en Régulation (HEAT) ou si déjà en mode Fumée
                        return (id(bbq_pid).mode == climate::CLIMATE_MODE_HEAT || id(smoke_mode_active));
                    then:
                      - lambda: |-
                          id(smoke_mode_active) = !id(smoke_mode_active);

                          if (id(smoke_mode_active)) {
                              // --- PASSAGE EN MODE FUMÉE ---
                              lv_obj_clear_flag(id(cont_smoke), LV_OBJ_FLAG_HIDDEN);
                              // On coupe le PID pour qu'il ne se batte pas avec le slider
                              auto call = id(bbq_pid).make_call();
                              call.set_mode("OFF");
                              call.perform();
                          } else {
                              // --- RETOUR AU MODE PID ---
                              lv_obj_add_flag(id(cont_smoke), LV_OBJ_FLAG_HIDDEN);

                              // 1. Reset intégrale PID natif
                              id(bbq_pid).reset_integral_term();

                              // 2. Reset Smith si actif — évite une reprise
                              //    avec des valeurs obsolètes du mode fumée
                              if (id(smith_active)) {
                                  id(pid_integral)   = 0.0f;
                                  id(pid_last_error) = 0.0f;
                                  id(pid_last_temp)  = 0.0f;
                                  id(pid_last_time)  = 0;
                                  id(smith_roc_last) = 0.0f;
                                  // Initialise l'EMA à la valeur de fumée courante
                                  // pour une transition douce sans rampe parasite
                                  id(smith_output_lisse).publish_state(id(smoke_intensity));
                                  id(smith_output_level) = id(smoke_intensity);
                                  ESP_LOGI("SMITH", "Reset Smith — retour mode fumée → PID. EMA init: %.2f", id(smoke_intensity));
                              }

                              // 3. Relance le PID en HEAT
                              auto call = id(bbq_pid).make_call();
                              call.set_mode("HEAT");
                              call.perform();
                          }
                    
                      # Après avoir changé les modes, on demande au routeur de mettre la vis à jour
                      - script.execute: update_auger_routing
                    else:
                      - logger.log: "Mode Manuel/Fumée refusé : le BBQ est arrêté"
            widgets:
              - label:
                  text: "MODE MAN/FUMÉE"
                  align: CENTER
                  text_font: roboto_20

# --- ZONE RÉGLAGE MODE FUMÉE  ---
        - obj:
            id: cont_smoke
            styles: style_obj_fond_gris
            x: 716
            y: 420
            width: 300
            height: 130
            bg_opa: 100%
            hidden: true
            widgets:
              - label:
                  text: "INTENSITÉ FUMÉE"
                  text_font: roboto_20
                  align: TOP_MID
              - label:
                  id: lbl_smoke_val
                  text: "Sél. intensité"
                  text_font: roboto_med
                  align: CENTER
                  y: -25
              - dropdown:
                  id: dropdown_smoke
                  width: 220
                  align: BOTTOM_MID
                  text_font: roboto_med
                  symbol: ${mdi_chevron_up} # Icône de chevron vers le haut pour indiquer le sens d'ouverture de la liste
                  y: -15
                  options:
                    - "5%  Fumee maximum"
                    - "7%  Fumee tres forte"
                    - "9%  Fumee forte"
                    - "11% Fumee moyenne"
                    - "13% Fumee legere"
                    - "15% Fumee minimal"
                    - "Charge 20%"
                    - "Charge 30%"
                    - "Charge 40%"
                    - "Charge 50%"
                  selected_index: 3   # Défaut : 11% fumée moyenne
                  on_value:
                    then:
                      - lambda: |-
                          // Correspondance index → valeur PWM
                          // Index 0 = 5%  (fumée max, combustion lente)
                          // Index 5 = 15% (fumée min, combustion vive)
                          // Index 6 à 9 = Charge de vis de 20% à 50%
                          const float valeurs[] = {0.05f, 0.07f, 0.09f, 0.11f, 0.13f, 0.15f, 0.20f, 0.30f, 0.40f, 0.50f};
                          id(smoke_intensity) = valeurs[x];

                          // Mise à jour du label d'affichage
                          const char* labels[] = {
                              "Fumée maximal   (5%)",
                              "Fumée très forte(7%)",
                              "Fumée forte     (9%)",
                              "Fumée moyenne   (11%)",
                              "Fumée légère    (13%)",
                              "Fumée mininimal (15%)",
                              "Charge 20%",
                              "Charge 30%",
                              "Charge 40%",
                              "Charge 50%"
                          };
                          lv_label_set_text(id(lbl_smoke_val), labels[x]);

                          // Applique immédiatement si mode fumée actif
                          if (id(smoke_mode_active)) {
                              id(update_auger_routing).execute();
                          }

        # --- ZONE ÉTAT DES COMPOSANTS ---
        - obj:
            styles: style_obj_fond_gris          
            x: 665
            y: 50
            width: 350
            height: 300
            bg_opa: 100%     # Transparent
            #layout: vertical
            widgets:
              - label: { x: 10, y: 10, id: lbl_meat1, text: "Aliment 1: --°F", text_font: roboto_25 }
              - label: { x: 10, y: 60, id: lbl_meat2, text: "Aliment 2: --°F", text_font: roboto_25 }
              - label: { x: 10, y: 110, id: lbl_fan, text: "Ventilateur: --", text_font: roboto_25 }
              - label: { x: 10, y: 160, id: lbl_auger, text: "Vis: --", text_font: roboto_25 }
              - label: { x: 10, y: 210, id: lbl_duty, text: "Charge mode PID: --%", text_font: roboto_25 }
              - label: { x: 10, y: 260, id: lbl_mode, text: "Mode: Veille", text_font: roboto_25 }

        # --- BOUTONS DÉPART ---
        - button:
            id: btn_start
            styles: style_btn
            x: 500
            y: 50
            width: 150
            height: 100
            bg_color: 0x2E7D32
            # 1. Quand on appuie, on lance un chrono de 3s
            on_press:
              then:
                - if:
                    condition:
                      lambda: |-
                        return !(id(is_igniting) || id(is_cooling) || id(bbq_pid).mode == climate::CLIMATE_MODE_HEAT);
                    then:
                      - script.execute: check_long_press
            # 2. Si on relâche avant la fin du script, le script s'arrête (donc rien ne se passe)
            on_release:
              then:
                - script.stop: check_long_press
            widgets:
              - label:
                  text: "DÉPART\n (3 sec)"
                  align: CENTER
                  text_font: roboto_32

        # --- BOUTONS ARRÊT ---
        - button:
            id: btn_stop
            styles: style_btn
            x: 500
            y: 160
            width: 150
            height: 100
            bg_color: 0xC62828
            on_click: 
              then:
                - if:
                    condition:
                      lambda: |-
                        // On autorise le STOP si on est en Allumage OU en Régulation (HEAT)
                        return (id(is_igniting) || id(bbq_pid).mode == climate::CLIMATE_MODE_HEAT);
                    then:
                      # Affiche la boîte de message de confirmation
                      - lvgl.widget.show:
                          id: stop_confirm_box
                    else:
                      - logger.log: "Bouton STOP ignoré : le BBQ n'est pas actif."
            widgets: 
              - label: 
                  id: lbl_stop_text
                  text: "ARRÊT"
                  align: CENTER
                  text_font: roboto_32

        # --- BOUTONS AMORÇE ---
        - button:
            id: btn_prime
            styles: style_btn
            x: 500
            y: 270
            width: 150
            height: 100
            bg_color: 0x1877F2 # Bleu initial
          
            # --- COMPORTEMENT MAINTENU (Appui continu) ---
            # Bloqué pendant is_cooling ET pre_cooldown_active : la purge
            # d'urgence de la vis se fait maintenant via le bouton PURGE VIS
            # dédié (avec allumeur + ventilateur automatiques), donc plus
            # besoin que ce bouton reste actif pendant l'arrêt.
            on_press:
              then:
                - if:
                    condition:
                      lambda: 'return (!id(safety_shutdown) && !id(pre_cooldown_active) && !id(is_cooling));'
                    then:
                      - globals.set: {id: manual_prime_active, value: 'true'}
                      - output.set_level: {id: auger_slow_pwm, level: 1.0} # On force 100%
                      - lvgl.obj.update: {id: btn_prime, bg_color: 0xff7f00}
            on_release:
              then:
                - globals.set: {id: manual_prime_active, value: 'false'}
                - if:
                    condition:
                      lambda: 'return !id(seq_amorcage_chrono).is_running();'
                    then:
                      - globals.set: {id: manual_prime_active, value: 'false'}
                      - output.set_level: {id: auger_slow_pwm, level: 0.0} # On remet à 0% sans couper le composant
                      - lvgl.obj.update: {id: btn_prime, bg_color: 0x1877F2}

            # --- COMPORTEMENT CLIC (Chrono 10 SEC) ---
            on_click:
              then:
                - if:
                    condition:
                      lambda: |-
                        // Vérifie si le BBQ est en marche avant de lancer le script
                        // (exclut aussi pre_cooldown_active : le PID régule encore
                        // activement le feu pendant la descente vers 225°F)
                        return ((id(is_igniting) || id(bbq_pid).mode == climate::CLIMATE_MODE_HEAT) &&
                                !id(pre_cooldown_active));
                    then:
                      - script.execute: seq_amorcage_chrono
                    else:
                      - logger.log: "Amorçage auto (10s) refusé : BBQ à l'arrêt."

            widgets:
              - label:
                  id: lbl_prime_text
                  text: "AMORÇE"
                  align: CENTER
                  text_font: roboto_32

        # --- BOUTON PURGE VIS ---
        # En is_cooling (urgence) : vis 100% + allumeur, pour vider les fines
        # particules bloquant le flux d'air (risque de braise remontant dans
        # la trémie). À l'arrêt complet (remplissage) : vis 100% seulement,
        # allumeur éteint. Marche/arrêt, avec plafond de sécurité et coupure
        # automatique sur surchauffe (voir script seq_purge_vis).
        - button:
            id: btn_purge
            styles: style_btn
            x: 500
            y: 380
            width: 150
            height: 100
            bg_color: 0x1877F2 # Bleu initial (même code couleur que AMORÇE)
            on_click:
              then:
                - if:
                    condition:
                      lambda: 'return id(purge_active);'
                    then:
                      # Deuxième appui = arrêt anticipé manuel
                      - globals.set: {id: purge_active, value: 'false'}
                      - logger.log: "Purge vis arrêtée manuellement"
                    else:
                      - if:
                          condition:
                            lambda: |-
                              return (!id(safety_shutdown) && !id(is_igniting) &&
                                      id(bbq_pid).mode != climate::CLIMATE_MODE_HEAT);
                          then:
                            - script.execute: seq_purge_vis
                          else:
                            - logger.log: "Purge vis refusée : BBQ en marche ou en erreur"
            widgets:
              - label:
                  id: lbl_purge_text
                  text: "PURGE\nVIS"
                  align: CENTER
                  text_font: roboto_32


        # --- ICÔNE PTC (chauffage du boitier) ---
        - label: 
            id: lbl_ptc_icon
            text: ""
            x: 420
            y: 450
            text_font: icon_font_lg


    - id: diag_page
      widgets:
        # --- Entête de la page ---
        - obj:
            align: TOP_MID
            styles: header
            widgets:
              - label:
                  text_font: montserrat_fr_36
                  text: "Diagnostic"
                  align: CENTER
                  text_align: CENTER
                  text_color: 0xFFFFFF

        - obj:
            width: 100%
            height: 520
            y: 40
            layout:
              type: flex
              flex_flow: ROW_WRAP
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
            widgets:
              # --- BLOC AFFICHAGE DES ERREURS ---
              - obj:
                  width: 300
                  height: 490
                  bg_color: ${color_grey}
                  layout: { type: flex, flex_flow: COLUMN }
                  widgets:
                    # --- Indicateurs d'erreurs ---
                    - label: { text: "ERREURS", text_font: montserrat_bold_fr_36 }
                    - label:
                        id: lbl_diag_allumage
                        text: "ALLUMAGE: OK"
                        text_font: roboto_22
                    - label:
                        id: lbl_diag_surchauffe
                        text: "TEMPÉRATURE: OK"
                        text_font: roboto_22
                    # --- Bouton de Réinitialisation ---
                    - button:
                        id: btn_reset_erreurs
                        styles: style_btn
                        width: 220
                        height: 60
                        bg_color: 0x424242
                        on_click:
                          then:
                            - script.execute: reset_systeme_erreurs
                        widgets:
                          - label: { text: "RÉINITIALISER", align: CENTER, text_font: roboto_22 }

              # --- BLOC AUTO-TUNE ---
              - obj:
                  width: 300
                  height: 490
                  bg_color: ${color_grey}
                  layout: { type: flex, flex_flow: COLUMN }
                  widgets:
                    - label: { text: "CNTRL PID", text_font: montserrat_bold_fr_36 }
                    - button:
                        id: btn_start_autotune
                        styles: style_btn
                        width: 250
                        height: 70
                        bg_color: 0x424242
                        on_press:
                          then:
                            - script.execute: check_long_press_autotune
                        on_release:
                          then:
                            - script.stop: check_long_press_autotune
                        widgets:
                          - label: { text: "LANCER AUTO-TUNE\n(3 sec)", align: CENTER, text_font: roboto_22 }
                    - label: { id: lbl_pid_kp, text: "P: --", text_font: roboto_22 }
                    - label: { id: lbl_pid_ki, text: "I: --", text_font: roboto_22 }
                    - label: { id: lbl_pid_kd, text: "D: --", text_font: roboto_22 }                          

              # --- Valeurs Divers en temps réel ---
              - obj:
                  width: 300
                  height: 490
                  bg_color: ${color_grey}
                  layout: { type: flex, flex_flow: COLUMN }
                  widgets:
                    - label: { text: "DIVERS", text_align: CENTER, text_font: montserrat_bold_fr_36 }
                    - label: { id: lbl_res_sonde_1, text: "Rés. Sonde 1: --Ω", text_font: roboto_22 }
                    - label: { id: lbl_res_sonde_2, text: "Rés. Sonde 2: --Ω", text_font: roboto_22 }
                    - label: { id: lbl_res_sonde_bbq, text: "Rés. Sonde BBQ: --Ω", text_font: roboto_22 }
                    - label: { id: lbl_volt_sonde_1, text: "Volt Sonde 1: --V", text_font: roboto_22 }
                    - label: { id: lbl_volt_sonde_2, text: "Volt Sonde 2: --V", text_font: roboto_22 }
                    - label: { id: lbl_volt_sonde_bbq, text: "Volt Sonde BBQ: --V", text_font: roboto_22 }
                    - label: { id: lbl_granules_mm, text: "Capteur Trémie: --mm", text_font: roboto_22 }

        # Zone affichage température et humidité extérieur
        - obj:
            styles: style_obj_fond_gris          
            #x: 562
            align: CENTER
            x: 50
            y: 100
            width: 150
            height: 90
            bg_opa: 100%     # Transparent
            #layout: vertical
            widgets:
              - label:
                  text: "Temp.\nExt."
                  align: TOP_LEFT
                  x: 15
                  y: 7
              - label:
                  id: temperature_ext
                  align: BOTTOM_LEFT
                  text_color: ${color_pv}
                  text_font: roboto_22
                  x: 10
                  y: -10
              - label:
                  text: "Hum.\nExt."
                  align: TOP_RIGHT
                  x: -15
                  y: 7
              - label:
                  id: humidite_ext
                  align: BOTTOM_RIGHT  
                  text_color: ${color_pv}
                  text_font: roboto_22
                  x: -10
                  y: -10  

        # Indicateur niveau de la trémie de granules
        - obj:
            styles: style_obj_fond_gris
            align: CENTER
            x: -85
            y: 125
            width: 65
            height: 200
            bg_opa: 100%
            widgets:
              - label:
                  text_font: montserrat_fr_14
                  text: "Niveau\nTrémie"
                  align: TOP_MID
                  y: 1
              - label:
                  text: "100%"
                  align: TOP_MID
                  #x: 15
                  y: 33
              - bar:
                  align: TOP_MID
                  y: 50
                  width: 20
                  height: 100
                  id: niveau_tremie_bar
                  min_value: 0
                  max_value: 100
                  value: !lambda "return (int)id(niveau_granules).state;"
              - label:
                  text: "0%"
                  align: BOTTOM_MID
                  y: -25
              - label:
                  id: lbl_text_pct_niveau_granules
                  text: "-- %"
                  text_color: ${color_pv}
                  text_font: roboto_22
                  align: BOTTOM_MID

  msgboxes:
    - id: start_confirm_box
      title: "Confirmation"
      close_button: false
      widgets:
        - label:
            text: "Voulez-vous démarrer le BBQ ?"
            align: CENTER
            text_font: montserrat_fr_14
            y: -70
      buttons:
        - text: "OUI"
          pad_top: 30
          pad_bottom: 30
          pad_left: 30
          pad_right: 30
          text_font: montserrat_fr_30
          on_click:
            then:
              - script.execute: seq_depart
              - lvgl.widget.hide: start_confirm_box
        - text: "NON"
          pad_top: 30
          pad_bottom: 30
          pad_left: 30
          pad_right: 30
          text_font: montserrat_fr_30
          on_click:
            then:
              - lvgl.widget.hide: start_confirm_box
      bg_color: ${color_grey}
      text_color: ${color_black}

    - id: stop_confirm_box
      title: "Confirmation"
      close_button: false
      widgets:
        - label:
            text: "Voulez-vous arrêter le BBQ ?"
            align: CENTER
            text_font: montserrat_fr_14
            y: -20
      buttons:
        - text: "OUI"
          pad_top: 40
          pad_bottom: 40
          text_font: montserrat_fr_30
          on_click:
            then:
              - script.execute: seq_arret
              - lvgl.widget.hide: stop_confirm_box
        - text: "NON"
          pad_top: 40
          pad_bottom: 40
          text_font: montserrat_fr_30
          on_click:
            then:
              - lvgl.widget.hide: stop_confirm_box
      bg_color: ${color_grey}
      text_color: ${color_black}

    - id: autotune_confirm_box
      title: "Confirmation Autotune"
      close_button: false
      widgets:
        - label:
            text: "Démarrer l'Autotune du PID ?\nLe BBQ doit être en marche à 225°F"
            align: CENTER
            text_font: montserrat_fr_14
            y: -20
      buttons:
        - text: "OUI"
          pad_top: 40
          pad_bottom: 40
          text_font: montserrat_fr_30
          on_click:
            then:
              - logger.log: "Démarrage Auto-tune à 225°F"
              # On force le mode AUTO (HEAT_COOL) requis par la nouvelle version
              - globals.set: {id: autotune_active, value: 'true'} # On lève le drapeau
              - climate.control: {id: bbq_pid, mode: "HEAT"}
              - climate.pid.autotune: bbq_pid
              - lvgl.widget.hide: autotune_confirm_box
        - text: "NON"
          pad_top: 40
          pad_bottom: 40
          text_font: montserrat_fr_30
          on_click:
            then:
              - lvgl.widget.hide: autotune_confirm_box
      bg_color: ${color_grey}
      text_color: ${color_black}

interval:
  - interval: 500ms
    then:
      - lambda: |-
          // On demande au contrôleur mcp_hub l'état physique de la pin 3
          // La fonction digital_read du MCP retourne un booléen
          bool etat_reel = id(mcp_hub).digital_read(3); 
          id(vis_en_mouvement).publish_state(etat_reel);

  - interval: 1s
    then:

      # Calcul Prédicteur de Smith (si actif)
      # → smith_out → smith_output_lisse → smith_output_level
      # → déclenche update_auger_routing via on_value de smith_output_lisse
      - script.execute: update_smith_output

      # Pour le mode PID natif (smith inactif), le routing est déjà
      # déclenché par on_value de pid_output_lisse. Cet appel direct
      # couvre les cas hors régulation (allumage, fumée, etc.)
      - script.execute: update_auger_routing

      # Température de la cuve avec gestion de sécurité si la sonde est déconnectée (NaN) ou < 0
      - lvgl.label.update:
          id: lbl_pv
          text: !lambda |-
            if (isnan(id(bbq_temp_pv).state) || id(bbq_temp_pv).state < 0) {
              // On lève l'erreur pour Home Assistant
              if (id(err_sonde_cuve).state == false) {
                id(err_sonde_cuve).publish_state(true);
              }
              return "fail °F";
            } else {
              // On efface l'erreur si la sonde revient
              if (id(err_sonde_cuve).state == true) {
                id(err_sonde_cuve).publish_state(false);
              }
              return esphome::str_sprintf("%.0f°F", id(bbq_temp_pv).state);
            }

      # Sonde Aliment 1 avec gestion de sécurité si la sonde est déconnectée (NaN) ou < 0
      - lvgl.label.update:
          id: lbl_meat1
          text: !lambda |-
            if (isnan(id(meat_1).state) || id(meat_1).state < 0) return "Aliment 1: fail";
            return esphome::str_sprintf("Aliment 1: %.1f°F", id(meat_1).state);

      # Sonde Aliment 2 avec gestion de sécurité si la sonde est déconnectée (NaN) ou < 0
      - lvgl.label.update:
          id: lbl_meat2
          text: !lambda |-
            if (isnan(id(meat_2).state) || id(meat_2).state < -40) return "Aliment 2: fail";
            return esphome::str_sprintf("Aliment 2: %.1f°F", id(meat_2).state);

      # État du ventilateur
      - lvgl.label.update:
          id: lbl_fan
          text: !lambda 'return (id(fan_relay).state ? std::string("Ventilateur: MARCHE") : std::string("Ventilateur: ARRET"));'

      # État visuel de la vis (Vérifie si le PWM est actif)
      - lvgl.label.update:
          id: lbl_auger
          text: !lambda |-
            if (id(vis_en_mouvement).state) {
              return "Vis: ROTATION";
            } else {
              return "Vis: PAUSE";
            }

      # Icône de chauffage (Toujours visible, couleur dynamique)
      - lvgl.label.update:
          id: lbl_ptc_icon
          # On affiche l'icône en permanence
          text: "\U0000F537"
          # On définit la couleur dynamiquement avec les substitutions
          text_color: !lambda |-
            if (id(ptc_heater).state) {
              return lv_color_hex(${color_heat});
            } else {
              return lv_color_hex(${color_off});
            }

      # Mise à jour Ventilateur
      - lvgl.label.update:
          id: lbl_fan_icon
          text_color: !lambda 'return id(fan_relay).state ? lv_color_hex(${color_on}) : lv_color_hex(${color_off});'

      # Mise à jour Allumeur
      - lvgl.label.update:
          id: lbl_igniter_icon
          text_color: !lambda 'return id(igniter_relay).state ? lv_color_hex(${color_heat}) : lv_color_hex(${color_off});'

      # Mise à jour Vis d'alimentation
      - lvgl.label.update:
          id: lbl_auger_icon
          text_color: !lambda 'return id(vis_en_mouvement).state ? lv_color_hex(${color_on}) : lv_color_hex(${color_off});'

      # Logique pour protection sur très haute température
      - if:
          condition: 
            lambda: |-
              float temp = id(bbq_temp_pv).state;
              return id(fan_relay).state        // BBQ en fonction
                  && temp > 600.0f             // Température critique
                  && temp < 1000.0f;           // Valeur plausible (pas un défaut de sonde)
          then:
            - if:
                condition:
                  lambda: 'return !id(safety_shutdown);'
                then:
                  - script.execute: seq_emergency_stop

      # Vérifie si présence d'erreur et met le texte en rouge si oui
      - lambda: |-
          // Si erreur d'allumage active
          if (id(err_allumage).state) {
            // Utiliser lv_label_set_text au lieu de .set_text
            lv_label_set_text(id(lbl_diag_allumage), "ALLUMAGE: ÉCHEC");
            // id(...).obj est déjà un pointeur lv_obj_t*, pas besoin de .obj.obj
            lv_obj_set_style_text_color(id(lbl_diag_allumage), lv_color_hex(0xC62828), 0);
            // Fond page principale en Rouge
            lv_obj_set_style_bg_color(id(main_page).obj, lv_color_hex(0xC62828), 0);
          }
          
          // Si erreur de surchauffe active
          if (id(err_surchauffe).state) {
            lv_label_set_text(id(lbl_diag_surchauffe), "TEMPÉRATURE: SURCHAUFFE");
            lv_obj_set_style_text_color(id(lbl_diag_surchauffe), lv_color_hex(0xC62828), 0);
            // Fond page principale en Rouge
            lv_obj_set_style_bg_color(id(main_page).obj, lv_color_hex(0xC62828), 0);
          }

      # --- Mise à jour des bouton Arrêt et Départ ---
      - lambda: |-
          static bool toggle = false;
          toggle = !toggle;

          // --- Mise à jour du bouton START ---
          // Le BBQ est occupé si le ventilateur tourne, ou s'il est en phase d'allumage/refroidissement
          bool is_busy = (id(fan_relay).state || id(is_igniting) || id(is_cooling));
          
          if (id(seq_depart).is_running()) {
              // Effet clignotant pendant la séquence de départ
              lv_obj_clear_state(id(btn_start), LV_STATE_DISABLED);
              lv_obj_set_style_bg_color(id(btn_start), toggle ? lv_color_hex(0x5C925C) : lv_color_hex(0x005500), LV_PART_MAIN);
          } else if (is_busy) {
              lv_obj_add_state(id(btn_start), LV_STATE_DISABLED);
              lv_obj_set_style_bg_color(id(btn_start), lv_color_hex(0x808080), LV_PART_MAIN);
          } else {
              lv_obj_clear_state(id(btn_start), LV_STATE_DISABLED);
              lv_obj_set_style_bg_color(id(btn_start), lv_color_hex(0x2E7D32), LV_PART_MAIN); // Vert
          }

          // --- Mise à jour du bouton STOP ---
          // On peut arrêter le BBQ seulement si le ventilateur est en marche
          bool can_stop = (id(fan_relay).state);
          
          if (id(seq_arret).is_running()) {
              // Effet clignotant pendant la séquence d'arrêt
              lv_obj_clear_state(id(btn_stop), LV_STATE_DISABLED);
              lv_obj_set_style_bg_color(id(btn_stop), toggle ? lv_color_hex(0xFF0000) : lv_color_hex(0x550000), LV_PART_MAIN);
              // Texte selon la phase : pré-refroidissement (->225°F) ou refroidissement final
              if (id(pre_cooldown_active)) {
                  lv_label_set_text(id(lbl_stop_text), "REFROID.\n->225F");
              } else {
                  lv_label_set_text(id(lbl_stop_text), "ARRÊT\nEN COURS");
              }
          } else if (!can_stop) {
              lv_obj_add_state(id(btn_stop), LV_STATE_DISABLED);
              lv_obj_set_style_bg_color(id(btn_stop), lv_color_hex(0x808080), LV_PART_MAIN);
              lv_label_set_text(id(lbl_stop_text), "ARRÊT");
          } else {
              lv_obj_clear_state(id(btn_stop), LV_STATE_DISABLED);
              lv_obj_set_style_bg_color(id(btn_stop), lv_color_hex(0xC62828), LV_PART_MAIN); // Rouge
              lv_label_set_text(id(lbl_stop_text), "ARRÊT");
          }

      # --- Mise à jour du bouton AMORÇAGE ---
      # Grisé pendant is_cooling ET pre_cooldown_active : la purge d'urgence
      # de la vis se fait maintenant via le bouton PURGE VIS dédié (allumeur
      # + ventilateur automatiques), donc plus besoin que ce bouton reste
      # actif pendant l'arrêt.
      - lambda: |-
          bool can_prime = (!id(safety_shutdown) && !id(pre_cooldown_active) && !id(is_cooling));
          if (!can_prime) {
            lv_obj_add_state(id(btn_prime), LV_STATE_DISABLED);
            lv_obj_set_style_bg_color(id(btn_prime), lv_color_hex(0x808080), LV_PART_MAIN);
          } else {
            lv_obj_clear_state(id(btn_prime), LV_STATE_DISABLED);
            if (!id(is_priming) && !id(manual_prime_active)) {
              lv_obj_set_style_bg_color(id(btn_prime), lv_color_hex(0x1877F2), LV_PART_MAIN);
            }
          }

      # --- Mise à jour du bouton PURGE VIS ---
      # Désactivé pendant l'allumage, la régulation (HEAT) ou un arrêt
      # d'urgence. Reste actif à l'arrêt complet ET pendant is_cooling.
      # Toujours cliquable si une purge est en cours (pour l'arrêter).
      - lambda: |-
          bool can_purge = (!id(safety_shutdown) && !id(is_igniting) &&
                             id(bbq_pid).mode != climate::CLIMATE_MODE_HEAT);
          if (!can_purge && !id(purge_active)) {
            lv_obj_add_state(id(btn_purge), LV_STATE_DISABLED);
            lv_obj_set_style_bg_color(id(btn_purge), lv_color_hex(0x808080), LV_PART_MAIN);
          } else {
            lv_obj_clear_state(id(btn_purge), LV_STATE_DISABLED);
            if (!id(purge_active)) {
              lv_obj_set_style_bg_color(id(btn_purge), lv_color_hex(0x1877F2), LV_PART_MAIN);
            }
          }

      # --- Mise à jour du bouton FUMÉE ---
      - lambda: |-
          // Désactivé si : Refroidissement OU (Ventilateur Off ET mode fumée pas déjà actif)
          bool can_smoke = !id(is_cooling) && (id(fan_relay).state || id(smoke_mode_active));
          
          if (!can_smoke) {
            lv_obj_add_state(id(btn_smoke_toggle), LV_STATE_DISABLED);
            lv_obj_set_style_bg_color(id(btn_smoke_toggle), lv_color_hex(0x808080), LV_PART_MAIN);
          } else {
            lv_obj_clear_state(id(btn_smoke_toggle), LV_STATE_DISABLED);
            lv_obj_set_style_bg_color(id(btn_smoke_toggle), lv_color_hex(0x607D8B), LV_PART_MAIN);
          }

      # --- SÉCURITÉ : FORCE LE PID À OFF SI LE VENTILATEUR S'ARRÊTE ---
      - if:
          condition:
            # Si le ventilateur est ARRÊTÉ
            lambda: 'return !id(fan_relay).state;'
          then:
            - if:
                condition:
                  # ET que le PID est encore en mode HEAT (Régulation)
                  lambda: 'return id(bbq_pid).mode == climate::CLIMATE_MODE_HEAT;'
                then:
                  - climate.control:
                      id: bbq_pid
                      mode: "OFF"
                  - logger.log: "Sécurité : PID forcé à OFF car le ventilateur est arrêté."

      # Erreur de surchauffe page diag et HA
      - if:
          condition:
            lambda: 'return id(bbq_temp_pv).state > 600.0;'
          then:
            - binary_sensor.template.publish: {id: err_surchauffe, state: ON}


      # --- LOGIQUE D'AFFICHAGE DU MODE ACTUEL (Mise à jour) ---
      - lvgl.label.update:
          id: lbl_mode
          text: !lambda |-
            if (id(purge_active)) return "Mode: Purge Vis";
            if (id(pre_cooldown_active)) return "Mode: Pré-refroid. (->225F)";
            if (id(is_cooling)) return "Mode: Refroidissement";
            if (id(is_igniting)) return "Mode: Allumage";
            if (id(smoke_mode_active)) return "Mode: Fumée (MAN)";
            if (id(bbq_pid).mode == climate::CLIMATE_MODE_HEAT) return "Mode: Régulation";
            // Si rien ne tourne, on affiche bien Veille
            return "Mode: Veille";

      # --- Logique pour que la cible du bbq_pid suivi son PV si on est en mode fumée (min de 150)
      - lambda: |-
          if (id(smoke_mode_active)) {
            float current_pv = id(bbq_temp_pv).state;
          
            // 1. Calcul de la cible (minimum selon var global smoke_temp_min
            float new_target = (current_pv < id(smoke_temp_min)) ? id(smoke_temp_min) : current_pv;

            // 2. Mise à jour de la cible du PID
            auto call = id(bbq_pid).make_call();
            call.set_target_temperature(new_target);
            call.perform();

            // 3. Synchronisation de l'affichage sur l'écran
            lv_arc_set_value(id(arc_sp), (int)new_target);
          }

      # Remplisage orange de l'arc suit le (PV)
      - lambda: |-
          float pv_val = id(bbq_temp_pv).state;

          // On vérifie que la valeur n'est pas "NaN" (sonde déconnectée)
          if (!std::isnan(pv_val)) {
            // Utilisation de la fonction LVGL correcte
            lv_arc_set_value(id(arc_pv), (int)pv_val);
          }


  - interval: 5s
    then:
      # apparition d'un logo Pitboss qui change de place au seconde lorsque l'écran de veille est actif
      - if:
          condition:
            switch.is_on: switch_antiburn
          then:
            - lambda: |-
                // Limites : écran (1024x600) - taille image (250x200)
                int max_x = 1024 - 250;
                int max_y = 600 - 200;

                // Génération de coordonnées aléatoires
                id(logo_x) = rand() % max_x;
                id(logo_y) = rand() % max_y;
                
            - lvgl.widget.update:
                id: container_antiburn
                x: !lambda "return id(logo_x);"
                y: !lambda "return id(logo_y);"

  - interval: 30s
    then:
      # Logique pour chauffage du boitier du contôleur
      - if:
          condition:
            or:
              - sensor.in_range: { id: temp_ext, below: 0.0 }
              - sensor.in_range: { id: hum_ext, above: 80.0 }
          then:
            - switch.turn_on: ptc_heater
          else:
            - switch.turn_off: ptc_heater

  - interval: 60s
    then:
      # Adaptation des paramètres de contrôle en fonction de la température extérieur
      - lambda: |-
          // ================================================================
          // ADAPTATION DES COEFFICIENTS SELON LA TEMPÉRATURE EXTÉRIEURE
          // ================================================================

          // Si compensation désactivée → ratio figé à 1.0
          if (!id(adapt_temp_ext_active)) {
              id(ratio_ext_gel) = 1.0f;
              auto *pid_c = (pid::PIDClimate *)id(bbq_pid);
              if (!id(smith_active)) {
                  // Conversion unités PROVOX → ESPHome
                  pid_c->set_kp(id(base_kp) / id(plage_procede));
                  pid_c->set_ki(id(base_ki) / (id(plage_procede) * 60.0f));
                  pid_c->set_kd(0.0f);
              }
              id(smith_tau)   = id(tuner_smith_tau).state;
              id(smith_theta) = id(tuner_smith_theta).state;
              float new_max_i = id(pid_sortie_max) * 0.5f;
              float new_min_i = -0.10f;
              pid_c->set_max_integral(new_max_i);
              pid_c->set_min_integral(new_min_i);
              id(update_auger_routing).execute();
              ESP_LOGD("ADAPT", "Compensation désactivée — ratio:1.0");
              return;
          }

          // Condition "BBQ froid" : arrêté + ventilateur off + PV < 100°F
          bool bbq_froid = (!id(fan_relay).state &&
                            id(bbq_pid).mode == CLIMATE_MODE_OFF &&
                            !id(is_cooling) &&
                            id(bbq_temp_pv).state < 100.0f);

          if (bbq_froid) {
              float t_ext = id(temp_ext).state;
              if (std::isnan(t_ext)) return;

              // Interpolation linéaire conservative
              // ratio=1.0 à 20°C, ratio=id(ratio_max_temp_ext) à -20°C
              // pente = (id(ratio_max_temp_ext) / 40.0f) par °C
              float ratio = 1.0f + (20.0f - t_ext) * ((id(ratio_max_temp_ext) - 1.0f) / 40.0f);

              // Bornes de sécurité
              if (ratio < 1.0f) ratio = 1.0f;   // Pas de réduction au dessus de 20°C
              if (ratio > id(ratio_max_temp_ext)) ratio = id(ratio_max_temp_ext);   // Maximum à -20°C

              id(ratio_ext_gel) = ratio;
              ESP_LOGI("ADAPT", "BBQ froid — t_ext:%.1f°C ratio gelé: %.3f", t_ext, ratio);
          }

          // Application du ratio gelé
          float ratio = id(ratio_ext_gel);
          auto *pid_c = (pid::PIDClimate *)id(bbq_pid);

          // Kp et Ki adaptés — Kd forcé à 0
          float new_kp = ((id(base_kp) * ratio) / id(plage_procede));
          float new_ki = ((id(base_ki) * ratio) / (id(plage_procede) * 60.0f));

          if (!id(smith_active)) {
              pid_c->set_kp(new_kp);
              pid_c->set_ki(new_ki);
              pid_c->set_kd(0.0f);
          }

          // Tau et theta fixes — pas de compensation pour l'instant
          id(smith_tau)   = id(tuner_smith_tau).state;
          id(smith_theta) = id(tuner_smith_theta).state;
          float new_max_i = id(pid_sortie_max) * 0.5f;
          float new_min_i = -0.10f;
          pid_c->set_max_integral(new_max_i);
          pid_c->set_min_integral(new_min_i);

          id(update_auger_routing).execute();

          ESP_LOGI("ADAPT", "ratio:%.3f | Kp:%.2f Ki:%.3f rép/min | Kp_natif:%.5f Ki_natif:%.6f | tau:%.0fs theta:%.0fs",
                   ratio,
                   id(base_kp) * ratio, id(base_ki) * ratio,
                   (id(base_kp) * ratio) / id(plage_procede),
                   (id(base_ki) * ratio) / (id(plage_procede) * 60.0f),
                   id(smith_tau), id(smith_theta));

################################################################################
# Obtention du temps venant du serveur Home Assistant
################################################################################
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update
          # Déclenche la mesure approximative